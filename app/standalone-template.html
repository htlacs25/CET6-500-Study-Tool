      document.querySelectorAll('[data-trans-input]').forEach(e=>e.oninput=()=>{const i=+e.dataset.transInput;ps.trans[i]={...(ps.trans[i]||{}),input:e.value,checked:false};document.querySelector('[data-check-trans="'+i+'"]').disabled=!e.value;persistDraft()});

    }
    function renderRecords(L){
      const p=progress(),raw=rawProgress(),old=Object.entries(store).filter(([k])=>k<selected).sort(([a],[b])=>b.localeCompare(a)).flatMap(([,r])=>storedWordErrors(r)),reviewWords=uniq([...storedWordErrors(raw),...old]),diag=RECOVERY.diagnostic,gate=readiness(recoveryStore,add(selected,1)),manual=Object.values(normalizeUserVocabulary(userVocab).items).filter(x=>x.active).sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999')||a.word.localeCompare(b.word));

      const archives=(raw.snapshotArchive||[]).map(compactArchiveEntry),oldSnapshot=raw.lessonSnapshot,oldSignature=oldSnapshot&&(oldSnapshot.contentSignature||lessonFingerprint(oldSnapshot)),archiveKey=oldSnapshot&&lessonDate(oldSnapshot)+'|'+oldSignature;
      if(oldSnapshot&&(L.cacheDateMismatch||L.cacheContentMismatch)&&!archives.some(x=>x.key===archiveKey))archives.push(compactArchiveEntry({key:archiveKey,reason:L.cacheDateMismatch?'wrong-date':'outdated-content',archivedAt:'开始新版课程时自动归档',lesson:oldSnapshot,progress:raw}));

      app.innerHTML='<section class="dark"><h1>学习记录与共同难点</h1><p>前3天、今天、后3天可切换；历史记录不按7天窗口删除。首次成绩、草稿和难点保存在本机同一浏览器入口，不会自动同步到聊天。</p><button id="exportRecords" class="primary">导出全部学习记录</button></section>'+weekOverview()+
      '<section class="card section"><div class="topline"><div><span class="pill">自主选择</span><h2>从文章加入的后续背诵词（'+manual.length+'）</h2></div></div><p class="muted">只有你在阅读、听力原文或每日泛读中点“加入后续背诵”的词才会出现在这里；它们按到期日占用固定复习名额，当天词表全部进入乱序默写，不额外添加词汇。</p>'+(manual.length?manual.map(x=>'<div class="vocab-row"><div><b>'+esc(x.word)+' '+esc(x.phonetic)+'</b>'+wordPosHtml(x)+'<p class="mini">下次复习：'+esc(x.dueDate||'等待安排')+'</p>'+hiddenZh(x.meaning,'查看中文释义')+'</div><button class="secondary" data-user-remove="'+esc(x.word)+'">移出后续复习</button></div>').join(''):'<p class="muted">目前没有手动加入的文章词。</p>')+(userVocabWarning?'<div class="answer bad">'+esc(userVocabWarning)+'</div>':'')+'</section>'+
      '<section class="card section"><h2>'+selected+' 分项记录</h2><div class="accuracygrid">'+modules.map(([name,c,t])=>'<div class="accuracy"><small>'+name+'</small><b>'+pct(p[c],p[t])+'</b><span>'+(p[t]?p[c]+'/'+p[t]:'尚未作答')+'</span></div>').join('')+'</div><p class="mini muted">只计每题首次提交，重做不覆盖首次成绩。基础恢复版与旧版同日记录分开保存。</p></section>'+
      '<div class="two section"><section class="card"><h2>本周复盘参考</h2><p>'+esc(gate.message)+'</p><p>近7天完整练习 '+gate.completeDays+' 天；不把缺失记录当0分。</p><div class="wrong">'+reviewWords.slice(0,30).map(x=>'<button data-speak="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div><p class="muted">错词自动进入固定复习名额，不额外堆量。</p></section><section class="dark"><h2>'+selected+' 共同记录难点</h2><div class="answer" style="color:#15231d"><b>根据作答自动归纳</b>'+difficultiesFor(p,diag).map(x=>'<p>'+esc(x)+'</p>').join('')+'</div><label for="notes" style="display:block;margin-top:14px">你补充的难点、实际用时和未完成项</label><textarea id="notes" class="textinput" placeholder="例如：看得懂但没听出声音；主句谓语仍会找错。实际用时：__分钟；未完成：__。">'+esc(p.notes)+'</textarea><button id="saveNotes" class="primary full">保存并完成10分钟复盘</button></section></div>'+
      '<section class="card section"><h2>2026-08-28 对话摸底（单独保留）</h2><p>'+esc(diag.source)+'</p><p>基础客观小项：7/8（87.5%）；讲解后巩固：3/3，另有拼写错误 imporve → improve。样本很小，不代表整体等级，也不等于四级分数。</p><p>'+esc(diag.listening)+'</p><ul>'+diag.focus.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+diag.examples.map(x=>'<details><summary>查看对话中的原句与订正</summary><p>原句：'+esc(x.input)+'</p><p>订正：'+esc(x.answer)+'</p>'+hiddenZh(x.zh,'查看中文')+'<p>'+esc(x.explanation)+'</p></details>').join('')+'</section>'+
      '<section class="card section"><h2>'+selected+' 错题与听写记录</h2>'+p.errorDetails.map(e=>'<details><summary>'+esc(e.label)+'</summary><p>你的首次答案：'+esc(e.answer)+'</p><p>参考：'+esc(e.expected)+'</p>'+hiddenZh(questionZh(e.label)||sentenceZh(e.expected),'查看中文')+'</details>').join('')+(p.errorDetails.length?'':'<p class="muted">本版暂无逐题错误记录；未读取的历史数据不视为零分。</p>')+(p.listeningErrors.length?'<h3>听写错句</h3>'+p.listeningErrors.map(x=>'<div class="answer"><button class="secondary" data-speak="'+esc(x)+'">▶ '+esc(x)+'</button>'+hiddenZh(sentenceZh(x),'查看中文')+'</div>').join(''):'')+'</section>'+
      archiveHtml+(oldSame?'<details class="section"><summary>'+selected+' 旧版记录（未覆盖）</summary><p>单词：'+(oldSame.wordCorrect||0)+'/'+(oldSame.wordTotal||0)+'；听写：'+(oldSame.listeningCorrect||0)+'/'+(oldSame.listeningTotal||0)+'；选择：'+(oldSame.quizCorrect||0)+'/'+(oldSame.quizTotal||0)+'</p><p>旧难点：'+esc(oldSame.notes||'未填写')+'</p><p>旧错词：'+esc((oldSame.wordErrors||[]).join('、'))+'</p></details>':'');
      bindCommon();document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected=b.dataset.open;tab='plan';reset();render()});
      document.getElementById('notes').oninput=e=>save({notes:e.target.value});
      document.getElementById('saveNotes').onclick=()=>{save({notes:document.getElementById('notes').value});mark('review');renderRecords(L)};
      document.getElementById('exportRecords').onclick=()=>{const data={version:3,exportedAt:new Date().toISOString(),legacy:legacyStore,recovery:recoveryStore,userVocabulary:userVocab,diagnostic:diag};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='CET4学习记录-'+today+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
    }

    function dailySummary(L){
      return '<section class="card section"><div class="topline"><h2>'+selected+' · 当天具体内容</h2><button class="secondary" data-go="records">查看七天不同课程</button></div><div class="day-summary"><button class="route secondary" data-go="practice"><b>阅读：'+esc(L.reading.titleZh||L.reading.title)+'</b>'+L.reading.questions.length+'题＋文章逐词查义</button><button class="route secondary" data-go="listening"><b>听力：'+esc(L.listening.titleZh||L.listening.title)+'</b>'+L.listening.questions.length+'题理解＋'+fullDictationItems(L.listening).length+'段全文听写</button><button class="route secondary" data-go="extensive"><b>泛读口语：'+esc(L.extensive.titleZh||L.extensive.title)+'</b>整篇可听＋2题＋跟读复述</button></div><p>新/激活词：'+(L.nw.map(w=>esc(w.word)).join('、')||'今天周测，不加新词')+'</p>'+hiddenZh(L.nw.map(w=>w.word+'：'+w.meaning).join('；'),'查看新词中文')+'<p class="mini muted">复习词会有重现；新词、阅读、听力和泛读按日期选取。任务数量相同，不代表内容相同。</p></section>';
    }
    function weekOverview(){
      return '<section class="section"><h2>七天课程一览：点击日期进入当天内容</h2><div class="weekgrid">'+seven().map(k=>{
        const L=lesson(k),p=progress(k),extra=L.extensive||{titleZh:'旧阶段未安排每日泛读',title:''},total=(p.wordTotal||0)+(p.listeningTotal||0)+(p.listeningChoiceTotal||0)+(p.quizTotal||0)+(p.extensiveTotal||0)+(p.sentenceTotal||0)+(p.translationTotal||0);
        return '<article class="card daily-card '+(k===selected?'active-day':'')+'"><small>'+k+' · '+(k>today?'预习':k<today?'复习':'今天')+'</small><h3>'+esc(L.title||'历史课程')+'</h3><p>阅读：'+esc(L.reading.titleZh||L.reading.title)+'</p><p>听力：'+esc(L.listening.titleZh||L.listening.title)+'</p><p>泛读：'+esc(extra.titleZh||extra.title)+'</p><details><summary>'+L.nw.length+'个新/激活词 · 查看词表</summary><p>'+L.nw.map(w=>esc(w.word)+' '+esc(w.phonetic)+' · '+esc(wordPartOfSpeechLabel(w,RECOVERY.articleGlossary||{}))).join('；')+'</p>'+hiddenZh(L.nw.map(w=>w.word+'：'+w.meaning).join('；'),'查看中文')+'</details><p class="mini">已提交 '+total+' 项；'+(total?'已有成绩保留':'尚未作答')+'</p><div class="actions"><button class="primary" data-course="'+k+'">学习 '+k.slice(5)+'</button><button class="secondary" data-record-day="'+k+'">查看记录</button></div></article>';
      }).join('')+'</div></section>';
    }
    let localSyncMessage='已载入D盘同源课程',latestRelease=null,checkingRelease=false,lastInteraction=0,releaseCallbacks=[];
    function entryLabel(){if(typeof window==='undefined')return '本地页面';return window.location.protocol==='file:'?'D盘单文件':/^(localhost|127\.0\.0\.1)$/.test(window.location.hostname)?'本地服务器':'网络页面'}
    function renderSyncBar(){
      const L=lesson(),repaired=L.cacheDateMismatch||L.cacheContentMismatch,missing=RELEASE.missingDates||[],structural=!(RELEASE.duplicateReading||[]).length&&!(RELEASE.duplicateListening||[]).length&&!(RELEASE.duplicateExtensive||[]).length&&!(RELEASE.duplicateCourse||[]).length&&!(RELEASE.dateMismatches||[]).length&&!(RELEASE.incompleteDictation||[]).length&&!(RELEASE.missingExtensive||[]).length&&!(RELEASE.missingGlosses||[]).length,integrity=structural&&!missing.length,status=integrity?'七天独立课程、全文听写、每日泛读与逐词释义校验通过':structural&&missing.length?'今天可学习；'+missing.length+'个未来日期待生成':'课程结构校验未通过，请先同步';
      document.getElementById('syncBar').innerHTML='<span>入口：'+esc(entryLabel())+' · 版本 '+esc(RELEASE.version)+' / '+esc(RELEASE.buildId)+' · 核验 '+esc(RELEASE.verifiedOn)+' · 当前课程 '+selected+'</span><span>'+esc(localSyncMessage)+'</span><span>'+esc(status)+'</span>'+(repaired?'<span class="tip">已隔离错日或旧版课程缓存，当前显示 '+esc(selected)+' 的正确内容；原成绩和旧快照仍保留。</span>':'')+'<button id="backToday" class="secondary">回到今天</button><button id="refreshLocal" class="secondary">'+(latestRelease&&latestRelease.buildId!==RELEASE.buildId?'保存并载入新版本':'刷新本地内容')+'</button>';
      document.getElementById('backToday').onclick=()=>{syncCalendar();selected=today;tab='plan';reset();render()};
      document.getElementById('refreshLocal').onclick=()=>reloadLocalPage(true);
    }
    function restoreView(){
      try{const v=JSON.parse(sessionStorage.getItem('cet6-view-after-update')||'null');if(v&&/^\d{4}-\d{2}-\d{2}$/.test(v.date)&&tabs.some(x=>x[0]===v.tab)){selected=v.date;tab=v.tab}sessionStorage.removeItem('cet6-view-after-update')}catch{}
    }
    function reloadLocalPage(manual=false){
      if(typeof window==='undefined')return;
      if(!manual&&(Date.now()-lastInteraction<15000||speechSynthesis.speaking))return;
      if(!persistDraft())return;
      try{
        sessionStorage.setItem('cet6-view-after-update',JSON.stringify({date:selected,tab}));
        if(latestRelease&&latestRelease.buildId!==RELEASE.buildId){
          const retryKey='cet6-reload-attempt-'+latestRelease.buildId,retries=Number(sessionStorage.getItem(retryKey)||0);
          if(!manual&&retries>=3){localSyncMessage='新文件已就绪，但浏览器连续命中旧缓存；请点“刷新本地内容”';renderSyncBar();return}
          sessionStorage.setItem(retryKey,String(retries+1));
          const target=new URL(window.location.href);target.searchParams.set('course-build',latestRelease.buildId);
          if(typeof window.location.replace==='function')window.location.replace(target.href);else window.location.href=target.href;
          return;
        }
      }catch{}
      window.location.reload();
    }
    function syncCalendar(){
      const date=dateKey(new Date());if(date===today)return;
      const followed=selected===today;today=date;if(followed){selected=date;reset()}render();
    }
    function checkLocalRelease(done){
      if(typeof window==='undefined')return;
      if(typeof done==='function')releaseCallbacks.push(done);
      if(checkingRelease)return;
      checkingRelease=true;
      const script=document.createElement('script');
      const url=new URL('study-release.js',window.location.href);url.searchParams.set('check',String(Date.now()));
      script.src=url.href;script.async=true;
      const finish=ok=>{checkingRelease=false;script.remove();const callbacks=releaseCallbacks.splice(0);callbacks.forEach(fn=>fn(ok))};
      script.onload=()=>finish(true);
      script.onerror=()=>{localSyncMessage='未检测到版本文件，可手动刷新；不要移动单独的HTML文件';renderSyncBar();finish(false)};
      document.head.appendChild(script);
    }
    function installLocalUpdates(){
      if(typeof window==='undefined')return;
      window.__CET6ReceiveRelease=release=>{
        if(!release||!release.buildId)return;
        latestRelease=release;
        localSyncMessage=release.buildId===RELEASE.buildId?'已核对：本地最新文件':'发现新版本，停止输入后自动保存并更新';
        if(release.buildId===RELEASE.buildId)try{sessionStorage.removeItem('cet6-reload-attempt-'+release.buildId)}catch{}
        renderSyncBar();
        if(release.buildId!==RELEASE.buildId&&!releaseCallbacks.length){reloadLocalPage();setTimeout(()=>reloadLocalPage(),16000)}
      };
      document.addEventListener('input',()=>{lastInteraction=Date.now()},true);
      window.addEventListener('focus',()=>{syncCalendar();checkLocalRelease()});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncCalendar();checkLocalRelease()}});
      setTimeout(checkLocalRelease,800);
      setInterval(()=>{syncCalendar();checkLocalRelease()},60000);
    }

    function bindCommon(){
      closeArticleWord();
      document.querySelectorAll('[data-translation-key]').forEach(b=>b.onclick=()=>toggleArticleTranslation(b));
      document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{selected=b.dataset.course;tab='plan';reset();render()});
      document.querySelectorAll('[data-record-day]').forEach(b=>b.onclick=()=>{selected=b.dataset.recordDay;tab='records';reset();render()});
      document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));
      document.querySelectorAll('[data-audio-pause]').forEach(b=>b.onclick=pauseSpeech);
      document.querySelectorAll('[data-audio-resume]').forEach(b=>b.onclick=resumeSpeech);
      document.querySelectorAll('[data-audio-stop]').forEach(b=>b.onclick=stopSpeech);
      document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});
      document.querySelectorAll('[data-lookup-word]').forEach(b=>b.onclick=()=>openArticleWord(b.dataset.lookupWord,b.dataset.lookupSource,b));
      document.querySelectorAll('[data-user-remove]').forEach(b=>b.onclick=()=>{if(saveUserVocab(removeUserVocabulary(userVocab,b.dataset.userRemove)))render()});
    }
    installArticleLookup();installWordSearch();restoreView();reset();render();setInterval(syncCalendar,60000);installLocalUpdates();
  })();
