    let store={...legacyStore,...recoveryStore},today=dateKey(new Date()),selected=today,tab='plan',rate=.8;

    function dateKey(d){const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d).map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}`}
    function parse(k){const [y,m,d]=k.split('-').map(Number);return {y,m,d,u:Date.UTC(y,m-1,d)}}function add(k,n){const x=new Date(parse(k).u+n*864e5);return `${x.getUTCFullYear()}-${String(x.getUTCMonth()+1).padStart(2,'0')}-${String(x.getUTCDate()).padStart(2,'0')}`}
    function day(k){return Math.max(0,Math.floor((parse(k).u-START)/864e5))}function at(i){return DATA.WORDS[((i%DATA.WORDS.length)+DATA.WORDS.length)%DATA.WORDS.length]}function uniq(a){return [...new Set(a)]}function word(n){return RECOVERY.words.find(x=>x.word.toLowerCase()===n.toLowerCase())||DATA.WORDS.find(x=>x.word.toLowerCase()===n.toLowerCase())}function norm(s){return normEnglish(s)}function normZh(s){return String(s).replace(/[\s；;，,。、：:]/g,'')}function meaningOk(input,meaning){const n=normZh(input);return n.length>0&&String(meaning).split(/[；;、，,]/).map(normZh).filter(Boolean).some(x=>n.includes(x)||x.includes(n)&&n.length>=2)}function spellHint(s){return s.length<=2?s[0]+' _':`${s[0]} ${Array.from({length:s.length-2},()=>'_').join(' ')} ${s.at(-1)}（${s.length}个字母）`}function meaningHint(s){const x=String(s).split(/[；;、，,]/)[0];return `${x[0]}…（核心义共${x.length}个汉字）`}function tokens(s){return new Set(norm(s).split(' ').filter(x=>x.length>2))}function overlap(a,b){const A=tokens(a),B=tokens(b);return B.size?[...B].filter(x=>A.has(x)).length/B.size:0}function hiddenZh(text,label='查看隐藏中文'){return text?`<details class="reveal"><summary>${label}</summary><p class="bilingual">${esc(text)}</p></details>`:''}function sentenceZh(text){for(const l of RECOVERY.lessons){const n=l.listening.dictation.indexOf(text);if(n>=0)return l.listening.dictationZh[n]}for(let i=0;i<DATA.LISTENINGS.length;i++){const n=DATA.LISTENINGS[i].dictation.indexOf(text);if(n>=0)return DATA.LISTENING_SUPPORT[i].dictationZh[n]}return''}function questionZh(text){for(const l of RECOVERY.lessons){const q=[...l.grammar,...l.reading.questions,...l.listening.questions].find(q=>q.prompt===text);if(q)return q.promptZh}for(const r of DATA.CET_READINGS){const q=r.questions.find(x=>x.prompt===text);if(q)return q.promptZh}for(let i=0;i<DATA.LISTENINGS.length;i++){const n=DATA.LISTENINGS[i].questions.findIndex(x=>x.prompt===text);if(n>=0)return DATA.LISTENING_QUESTION_ZH[i][n].promptZh}const n=DATA.GRAMMAR_Q           value.snapshotArchive=archives.some(x=>x.key===archiveKey)?archives:[...archives,archived];

    }

    function persistDraft(){const L=lesson();return save({draft:JSON.parse(JSON.stringify({lessonId:L.id,contentSignature:L.contentSignature,courseKey:courseKey(L),ws,ls,ps,rate}))})}

      document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncCalendar();checkLocalRelease()}});
      setTimeout(checkLocalRelease,800);
      setInterval(()=>{syncCalendar();checkLocalRelease()},60000);
    }

    function bindCommon(){document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{selected=b.dataset.course;tab='plan';reset();render()});document.querySelectorAll('[data-record-day]').forEach(b=>b.onclick=()=>{selected=b.dataset.recordDay;tab='records';reset();render()});document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()})}
    restoreView();reset();render();setInterval(syncCalendar,60000);installLocalUpdates();
  })();
  </script>
</body>
</html>
