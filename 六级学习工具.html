 Room 408. Please bring your student card and a copy of your class schedule. The position includes two weekday evenings and Saturday morning. You do not need previous office experience, but be ready to discuss how you communicate with other people.","passageZh":"你好，这里是学生服务办公室，来电是关于你的申请。我们想在周二三点十五分于408室面试你。请带学生证和一份课程表。该职位包括两个工作日晚间和周六上午。不要求过去的办公室经验，但请准备讨论你如何与他人沟通。","dictation":["Please bring a copy of your class schedule.","Be ready to discuss how you communicate with other people."],"dictationZh":["请带一份你的课程表。","请准备讨论你如何与他人沟通。"],"questions":[{"prompt":"When is the interview?","promptZh":"面试在什么时候？","options":["Tuesday at three fifteen","Tuesday at four eight","Saturday morning","Wednesday evening"],"optionsZh":["周二三点十五","周二四点零八","周六上午","周三晚上"],"answer":0,"explanation":"408是房间号，时间是Tuesday at three fifteen。","tag":"listeningChoice"},{"prompt":"What is not required for the position?","promptZh":"这个职位不要求什么？","options":["A student card","A class schedule","Previous office experience","Communication with people"],"optionsZh":["学生证","课程表","过去办公室经验","与人沟通"],"answer":2,"explanation":"明确说You do not need previous office experience。","tag":"listeningChoice"}]},"sent":{"text":"Applicants who connect their skills with real examples often answer interview questions more clearly.","main":"Applicants often answer interview questions more clearly.","translation":"能把技能与真实事例联系起来的申请者，回答面试问题时往往更清楚。","core":["applicants","answer","interview","questions"],"keywords":["申请者","技能","真实事例","面试问题"],"structure":"who connect their skills with real examples修饰Applicants；主句谓语answer。","mainZh":"申请者回答面试问题往往更清楚。","level":"基础衔接句法","topic":"定语从句与求职表达","grammar":["connect是从句谓语，answer是主句谓语。","connect A with B表示把A与B联系起来。"],"examTip":"先找Applicants answer questions，再理解申请者的特征。"},"trans":[{"source":"我打算申请学生服务中心的兼职职位。","answer":"I plan to apply for a part-time position at the student services center.","keywords":["plan to","apply for","part-time position","student services center"],"grammar":"plan to do；apply for a hrase":"clarify a meaning","example":"She asked a question to clarify the meaning.","exampleZh":"她提问以澄清含义。"},{"word":"confidence","phonetic":"/ˈkɑːnfɪdəns/","meaning":"信心","phrase":"build confidence","example":"Regular conversation practice builds confidence.","exampleZh":"规律的对话练习能建立信心。"},{"word":"exchange","phonetic":"/ɪksˈtʃeɪndʒ/","meaning":"交流；交换","phrase":"exchange ideas","example":"Students exchanged ideas after the talk.","exampleZh":"讲座后学生们交流了想法。"}],"grammar":[{"prompt":"It took Maya several days to adapt ___ the new routine.","promptZh":"玛雅花了几天适应新的日常安排。","options":["to","with","from","by"],"optionsZh":["适应","和","从","通过"],"answer":0,"explanation":"adapt to是固定搭配。","tag":"preposition"},{"prompt":"This custom is unfamiliar ___ many exchange students.","promptZh":"许多交换生不熟悉这一习俗。","options":["for","to","at","into"],"optionsZh":["为了","对……而言陌生","在","进入"],"answer":1,"explanation":"be unfamiliar to somebody表示对某人而言陌生。","tag":"preposition"},{"prompt":"Could you ___ what this expression means?","promptZh":"你能解释一下这个表达是什么意思吗？","options":["clarifies","clarified","clarify","clarifying"],"optionsZh":["第三人称单数","过去式","原形","现在分词"],"answer":2,"explanation":"Could you后用动词原形clarify。","tag":"modal"},{"prompt":"Students become more confident when they ___ speaking regularly.","promptZh":"学生经常练习口语时会变得更自信。","options":["practice","practices","practiced","are practice"],"optionsZh":["一般现在时原形","第三人称单数","过去式","错误结构"],"answer":0,"explanation":"时间从句描述一般规律，主语they用practice。","tag":"present"},{"prompt":"We may disagree, ___ we can still respect each other.","promptZh":"我们可能意见不同，但仍可相互尊重。","options":["but","because","so","unless"],"optionsZh":["但是","因为","所以","除非"],"answer":0,"explanation":"disagree与respect形成转折。","tag":"connector"},{"prompt":"Which is the main verb in “Customs that seem unusual often have a practical reason” ?","promptZh":"在“看似不寻常的习俗往往有实际原因”中，主句谓语是什么？","options":["seem","unusual","have","reason"],"optionsZh":["看起来（从句谓语）","不寻常的","有（主句谓语）","原因"],"answer":2,"explanation":"that seem unusual修饰Customs；主句谓语have。","tag":"main-verb"}],"reading":{"title":"Asking Instead of Guessing","titleZh":"提问而不是猜测","level":"基础衔接 · 原创模拟","topic":"跨文化交流与直接理解","passage":"During an international student dinner, Evan noticed that his classmate Aiko did not open a gift immediately. In Evan's family, people usually open gifts in front of the giver, so he first wondered whether Aiko disliked it. Instead of remaining silent, he asked politely if gift opening was different in her family. Aiko explained that she often waited until later because opening a gift slowly at home allowed her to show careful attention. She then asked about Evan's custom, and both students laughed at how easily they could have misunderstood each other. The conversation did not prove that everyone from one country behaves in the same way. Family habits differ, and people may make individual choices. What mattered was their method: they described what they had noticed, asked without making an accusation, and listened to the answer. By clarifying an unfamiliar action, Evan and Aiko turned a possible misunderstanding into a useful exchange.","passageZh":"一次国际学生晚餐上，埃文发现同学爱子没有立刻打开礼物。在埃文家，人们通常当着送礼者打开，所以他起初怀疑爱子不喜欢。埃文没有沉默，而是礼貌询问她家是否有不同的拆礼习惯。爱子解释，她常等到晚些时候，因为在家慢慢打开能表现认真对待。她又询问埃文家的习惯，两人笑着意识到彼此多么容易误会。这段对话并不说明同一国家的人都一样；家庭习惯不同，个人也会做不同选择。重要的是方法：描述观察到的事，不带指责地提问，并倾听回答。通过澄清陌生行为，两人把可能的误会变成了有益交流。","questions":[{"prompt":"Why did Evan initially feel unsure?","promptZh":"埃文起初为什么感到疑惑？","options":["Aiko arrived late","Aiko did not open the gift immediately","The gift was missing","No one spoke English"],"optionsZh":["爱子迟到","爱子没有立刻拆礼物","礼物丢了","没人说英语"],"answer":1,"explanation":"开头的行为差异引起疑惑。","tag":"reading"},{"prompt":"How did Evan respond?","promptZh":"埃文怎样应对？","options":["He accused Aiko","He took the gift back","He asked a polite question","He left without speaking"],"optionsZh":["指责爱子","拿回礼物","礼貌提问","不说话离开"],"answer":2,"explanation":"他没有猜下去，而是询问对方家庭习惯。","tag":"reading"},{"prompt":"What caution does the passage include?","promptZh":"文章包含什么提醒？","options":["All families follow one national custom","Individual and family habits can differ","Questions always cause conflict","Gifts should never be opened"],"optionsZh":["所有家庭遵循同一国家习俗","个人和家庭习惯可能不同","提问总会引起冲突","礼物永远不该打开"],"answer":1,"explanation":"文章明确反对把个例概括为所有人。","tag":"reading"},{"prompt":"What made the exchange successful?","promptZh":"什么使这次交流成功？","options":["Avoiding the topic","Making a quick judgment","Observing, asking, and listening","Agreeing on every custom"],"optionsZh":["避开话题","快速判断","观察、提问和倾听","对所有习俗意见一致"],"answer":2,"explanation":"倒数第二句列出三个步骤。","tag":"reading"}]},"listening":{"title":"Checking the Meaning of an Invitation","titleZh":"确认邀请的含义","level":"基础衔接短听力 · 合成朗读","tip":"听清造成误解的词、澄清问题和最终安排；练习Do you mean...?句型。","passage":"When Lara said, “Come by around seven,” I was not sure whether she meant exactly seven. I asked, “Do you mean I should arrive at seven, or is a little later all right?” Lara explained that any time between seven and seven thirty was fine. I thanked her for clarifying and arrived at seven fifteen with a small dessert to share.","passageZh":"拉拉说“大约七点过来”时，我不确定是否必须正好七点。我问：“你的意思是我应该七点到，还是晚一点也可以？”拉拉解释七点到七点半都行。我感谢她澄清，并在七点十五带着一份分享的小甜点到达。","dictation":["Do you mean I should arrive at seven?","I thanked her for clarifying the time."],"dictationZh":["你的意思是我应该七点到吗？","我感谢她澄清了时间。"],"questions":[{"prompt":"What was unclear to the speaker?","promptZh":"说话者不清楚什么？","options":["The address","The meaning of around seven","The type of dessert","Lara's name"],"optionsZh":["地址","“大约七点”的含义","甜点种类","拉拉的名字"],"answer":1,"explanation":"疑问是是否必须exactly seven。","tag":"listeningChoice"},{"prompt":"When did the speaker arrive?","promptZh":"说话者什么时候到达？","options":["Six thirty","Seven exactly","Seven fifteen","Seven forty-five"],"optionsZh":["六点半","正好七点","七点十五","七点四十五"],"answer":2,"explanation":"末句明确说arrived at seven fifteen。","tag":"listeningChoice"}]},"sent":{"text":"People who ask respectful questions can clarify unfamiliar customs without creating conflict.","main":"People can clarify unfamiliar customs without creating conflict.","translation":"以尊重方式提问的人可以澄清陌生习俗，而不制造冲突。","core":["people","can","clarify","customs"],"keywords":["人","尊重","澄清","陌生习俗","冲突"],"structure":"who ask respectful questions修饰People；主句谓语can clarify；without后接creating。","mainZh":"人们可以澄清陌生习俗而不制造冲突。","level":"基础衔接句法","topic":"定语从句与沟通策略","grammar":["ask是从句谓语，can clarify是主句谓语。","介词without后接动名词creating。"],"examTip":"先抓People can clarify customs，再处理方式和结果。"},"trans":[{"source":"适应新的文化需要时间。","answer":"It takes time to adapt to a new culture.","keywords":["takes time","adapt to","new culture"],"grammar":"It takes time to do；adapt to固定搭配。","acceptedAnswers":["It takes time to adapt to a new culture.","Adapting to a new culture takes time."],"level":"基础衔接表达","topic":"文化适应","chunks":["it takes time","to adapt to","a new culture"],"alternative":"Adapting to a new culture takes time."},{"source":"如果你不明白，可以礼貌地请对方澄清。","answer":"If you do not understand, you can politely ask the other person to clarify.","keywords":["if","do not understand","can politely ask","clarify"],"grammar":"if引导条件从句；ask somebody to do。","acceptedAnswers":["If you do not understand, you can politely ask the other person to clarify.","If something is unclear, you can politely ask for clarification."],"level":"基础衔接表达","topic":"澄清误解","chunks":["if you do not understand","politely ask","to clarify"],"alternative":"If something is unclear, you can politely ask for clarification."}]},"2026-09-21":{"title":"校园讲座：从听懂到记下要点","grammarTip":"先抓主句的主语和谓语，再处理who、that引导的修饰部分；记录讲座时优先写关键词，不必逐字抄写。","words":[{"word":"lecture","phonetic":"/ˈlɛktʃɚ/","meaning":"讲座；讲课","phrase":"attend a lecture","example":"I attended a lecture on study habits.","exampleZh":"我参加了一场关于学习习惯的讲座。"},{"word":"absorb","phonetic":"/əbˈzɔrb/","meaning":"吸收；理解","phrase":"absorb information","example":"Students absorb more when they review after a lecture.","exampleZh":"学生在讲座后复习时能吸收更多内容。"},{"word":"academic","phonetic":"/ˌækəˈdɛmɪk/","meaning":"学术的","phrase":"academic performance","example":"The lecture discusses an academic topic.","exampleZh":"这场讲座讨论一个学术话题。"},{"word":"topic","phonetic":"/ˈtɑpɪk/","meaning":"主题；话题","phrase":"a research topic","example":"The speaker introduced the topic with a question.","exampleZh":"演讲者用一个问题引出了主题。"},{"word":"explain","phonetic":"/ɪkˈspleɪn/","meaning":"解释；说明","phrase":"explain an idea","example":"Can you explain this idea more clearly?","exampleZh":"你能更清楚地解释这个观点吗？"},{"word":"mention","phonetic":"/ˈmɛnʃən/","meaning":"提到；说起","phrase":"mention a reason","example":"The professor mentioned two common mistakes.","exampleZh":"教授提到了两个常见错误。"},{"word":"detail","phonetic":"/ˈdiːteɪl/","meaning":"细节；详情","phrase":"an important detail","example":"One important detail was missing from my notes.","exampleZh":"我的笔记漏掉了一个重要细节。"},{"word":"summarize","phonetic":"/ˈsʌməraɪz/","meaning":"总结；概括","phrase":"summarize the main idea","example":"Please summarize the passage in two sentences.","exampleZh":"请用两句话概括这篇文章的主旨。"}],"grammar":[{"prompt":"Neither of the two speakers ___ available this afternoon.","promptZh":"两位演讲者今天下午都没空。","options":["is","are","be","being"],"optionsZh":["是（单数）","是（复数）","原形","现在分词"],"answer":0,"explanation":"Neither作主语时通常按单数处理，所以用is。","tag":"subject-verb"},{"prompt":"The student who sits near the window ___ notes carefully.","promptZh":"坐在窗边的那名学生认真记笔记。","options":["take","takes","taking","to take"],"optionsZh":["动词原形","第三人称单数","现在分词","不定式"],"answer":1,"explanation":"who sits near the window修饰student；主句主语是单数student，谓语用takes。","tag":"main-verb"},{"prompt":"Yesterday we ___ a lecture on memory.","promptZh":"昨天我们参加了一场关于记忆的讲座。","options":["attend","attends","attended","are attending"],"optionsZh":["原形","第三人称单数","过去式","现在进行时"],"answer":2,"explanation":"Yesterday提示一般过去时，用attended。","tag":"past"},{"prompt":"We should ___ the main points instead of every word.","promptZh":"我们应该记录要点，而不是每一个词。","options":["record","records","recorded","recording"],"optionsZh":["动词原形","第三人称单数","过去式","现在分词"],"answer":0,"explanation":"情态动词should后接动词原形record。","tag":"modal"},{"prompt":"Although the lecture was fast, Maya ___ the main idea.","promptZh":"虽然讲座语速很快，玛雅还是理解了主旨。","options":["understand","understands","understood","understanding"],"optionsZh":["原形","第三人称单数","过去式","现在分词"],"answer":2,"explanation":"was表明叙述过去发生的事情，主句也用过去式understood。","tag":"past"},{"prompt":"The professor asked us ___ a short summary.","promptZh":"教授要求我们写一篇简短总结。","options":["write","wrote","writing","to write"],"optionsZh":["原形","过去式","动名词","不定式"],"answer":3,"explanation":"ask somebody to do something表示“要求某人做某事”。","tag":"word-form"}],"reading":{"title":"From Notes to a Clear Summary","titleZh":"从笔记到清楚的总结","passage":"During her first weeks at university, Mei tried to write down every word in each lecture. Because she was always looking at her notebook, she sometimes missed the speaker's next point. A classmate suggested a different method. Before a lecture, Mei now reads the title and writes two questions about the topic. While listening, she records only key terms, examples, and words that show a change of idea, such as however or therefore. Within ten minutes after class, she adds any details she still remembers. She then closes the notebook and explains the lecture aloud in one minute. If she cannot explain a point, she checks that part of her notes or asks a classmate. This process takes less time than copying everything and helps Mei notice what she truly understands.","passageZh":"刚上大学的几周里，梅试图记下每场讲座的每一个词。由于她总盯着笔记本，有时会错过演讲者的下一个要点。同学建议她换一种方法。现在上课前，她会先看标题，并围绕主题写两个问题。听讲时，她只记录关键词、例子以及however、therefore等表示思路变化的词。下课十分钟内，她补上仍记得的细节。随后她合上笔记本，用一分钟口头解释讲座内容。若有一点讲不清，她就查看相应笔记或询问同学。这种方法比逐字抄写更省时，也帮助她发现自己是否真正理解。","questions":[{"prompt":"What problem did Mei have when she copied every word?","promptZh":"梅逐字记录时遇到了什么问题？","options":["She missed later points","She forgot her notebook","She arrived too early"],"optionsZh":["她会错过后面的要点","她忘带笔记本","她到得太早"],"answer":0,"explanation":"第二句说明她低头记录时会错过演讲者接下来的内容。","tag":"reading"},{"prompt":"What does Mei do before a lecture now?","promptZh":"现在梅在讲座前做什么？","options":["Memorizes the whole textbook","Writes two questions about the topic","Asks the speaker for answers"],"optionsZh":["背下整本教材","围绕主题写两个问题","向演讲者索要答案"],"answer":1,"explanation":"文中明确说她看标题后写两个与主题有关的问题。","tag":"reading"},{"prompt":"When does Mei add remembered details?","promptZh":"梅什么时候补充记得的细节？","options":["A week later","During the next lecture","Within ten minutes after class"],"optionsZh":["一周以后","下一场讲座期间","下课后十分钟内"],"answer":2,"explanation":"定位Within ten minutes after class。","tag":"reading"},{"prompt":"What is the main benefit of Mei's new method?","promptZh":"梅的新方法主要有什么好处？","options":["It shows what she truly understands","It removes the need to listen","It makes every lecture shorter"],"optionsZh":["它能显示她真正理解了什么","它让她不用听讲","它让每场讲座变短"],"answer":0,"explanation":"结尾指出这种方法帮助她辨认自己是否真正理解。","tag":"reading"}],"level":"基础衔接 · 原创模拟","topic":"校园学习与讲座笔记"},"listening":{"title":"A Change of Lecture Room","titleZh":"讲座教室变更","passage":"This is a message for students attending Professor Hall's lecture this afternoon. The lecture will begin at three as planned, but it has moved from Room 204 to Room 310 because the first room has a technical problem. Please bring a notebook and arrive five minutes early. The professor will answer questions during the final ten minutes.","passageZh":"这是给参加霍尔教授今天下午讲座的学生的通知。讲座仍按计划三点开始，但由于原教室出现技术问题，地点已从204室改到310室。请带笔记本并提前五分钟到达。教授将在最后十分钟回答问题。","dictation":["The lecture will begin at three as planned.","Please bring a notebook and arrive five minutes early."],"dictationZh":["讲座将按计划在三点开始。","请带上笔记本并提前五分钟到达。"],"questions":[{"prompt":"Where will the lecture be held?","promptZh":"讲座将在哪里举行？","options":["Room 204","Room 310","The library"],"optionsZh":["204室","310室","图书馆"],"answer":1,"explanation":"地点从Room 204改到了Room 310。","tag":"listeningChoice"},{"prompt":"When can students ask questions?","promptZh":"学生什么时候可以提问？","options":["In the final ten minute whether the information is accurate.","exampleZh":"检查信息是否准确。"},{"word":"research","phonetic":"/rɪˈsɝtʃ/","meaning":"研究；调查","phrase":"conduct research","example":"The group is doing research on campus travel.","exampleZh":"这个小组正在研究校园出行。"},{"word":"evidence","phonetic":"/ˈɛvɪdəns/","meaning":"证据；依据","phrase":"provide evidence","example":"A strong argument needs clear evidence.","exampleZh":"有力的论点需要清楚的证据。"},{"word":"evaluate","phonetic":"/ɪˈvæljuˌeɪt/","meaning":"评价；评估","phrase":"evaluate results","example":"We evaluate the website before using its claims.","exampleZh":"使用网站的说法前，我们先评估它。"},{"word":"contrast","phonetic":"/ˈkɑntræst/","meaning":"对比","phrase":"in contrast","example":"Contrast the two reports before making a decision.","exampleZh":"作决定前对比这两份报告。"},{"word":"author","phonetic":"/ˈɔθɚ/","meaning":"作者","phrase":"identify the author","example":"Always identify the author before using an article.","exampleZh":"使用文章前一定要确认作者。"},{"word":"publish","phonetic":"/ˈpʌblɪʃ/","meaning":"出版；发表","phrase":"publish a report","example":"The organization published its report online.","exampleZh":"该机构在网上发布了报告。"},{"word":"reference","phonetic":"/ˈrɛfərəns/","meaning":"参考；参考资料","phrase":"a reference list","example":"Her reference list includes five academic articles.","exampleZh":"她的参考文献表包括五篇学术文章。"}],"grammar":[{"prompt":"Information that comes from an unknown account ___ not always reliable.","promptZh":"来自未知账号的信息并不总是可靠。","options":["is","are","be","were"],"optionsZh":["是（单数）","是（复数）","原形","过去时复数"],"answer":0,"explanation":"主句主语Information是不可数名词，that从句不改变主谓关系，所以用is。","tag":"main-verb"},{"prompt":"We compared the new report ___ the earlier one.","promptZh":"我们把新报告与早先的报告作了比较。","options":["with","at","for","from"],"optionsZh":["与……比较","在","为了","来自"],"answer":0,"explanation":"compare A with B是常用搭配。","tag":"preposition"},{"prompt":"The article ___ online last month.","promptZh":"这篇文章上个月在网上发表了。","options":["publishes","published","was published","is publishing"],"optionsZh":["主动一般现在时","主动过去式","一般过去时被动","现在进行时"],"answer":2,"explanation":"文章是“被发表”，且last month提示过去，用was published。","tag":"passive"},{"prompt":"Before ___ the claim, check who wrote it.","promptZh":"在接受这一说法前，先检查是谁写的。","options":["accept","accepts","accepted","accepting"],"optionsZh":["原形","第三人称单数","过去式","动名词"],"answer":3,"explanation":"介词before后可接动名词accepting。","tag":"word-form"},{"prompt":"The evidence was limited, ___ the writer made a careful conclusion.","promptZh":"证据有限，因此作者得出了谨慎的结论。","options":["so","although","unless","while"],"optionsZh":["所以","尽管","除非","当……时"],"answer":0,"explanation":"前因后果关系用so。","tag":"connector"},{"prompt":"Sources that list their authors are often easier ___.","promptZh":"列出作者的资料来源通常更容易核查。","options":["check","checked","to check","checking"],"optionsZh":["原形","过去式","不定式","动名词"],"answer":2,"explanation":"形容词easier后常接不定式to check。","tag":"word-form"}],"reading":{"title":"Three Checks Before Sharing","titleZh":"转发前的三项检查","passage":"For a class project, Arun found a surprising number in a short online post. He wanted to use it immediately because it supported his argument. His partner asked him to make three checks first. They looked for the author, but the post gave only a user name. They searched for the original report and discovered that the number came from a survey published eight years earlier. Finally, they compared the survey with a recent university study. The newer study described a different group of people and reached a less dramatic conclusion. Arun did not throw away the old source. Instead, he explained its date and limits, then used the newer evidence for his main claim. He learned that checking a source does not simply mean deciding whether it is good or bad; it means understanding exactly what the source can support.","passageZh":"阿伦为课堂项目找到了一篇网络短文，其中有一个令人惊讶的数字。他想立即采用，因为它支持自己的论点。搭档让他先做三项检查。他们查找作者，但帖子只显示用户名；接着寻找原始报告，发现该数字来自八年前发表的一项调查；最后又把这项调查与近期一项大学研究比较。新研究针对不同人群，结论也没那么惊人。阿伦没有丢弃旧资料，而是说明其日期和局限，再用较新的证据支持主要观点。他明白，核查来源不是简单判断好坏，而是弄清它究竟能支持什么。","questions":[{"prompt":"Why did Arun first want to use the number?","promptZh":"阿伦起初为什么想使用这个数字？","options":["It supported his argument","It was easy to pronounce","It came from his teacher"],"optionsZh":["它支持他的论点","它容易读出来","它来自老师"],"answer":0,"explanation":"开头说明这个数字支持他的argument。","tag":"reading"},{"prompt":"What did they learn about the original survey?","promptZh":"他们了解到原始调查的什么情况？","options":["It had no numbers","It was eight years old","It studied only teachers"],"optionsZh":["它没有数字","它已有八年历史","它只研究教师"],"answer":1,"explanation":"原报告中的调查发表于八年前。","tag":"reading"},{"prompt":"How was the newer study different?","promptZh":"较新的研究有何不同？","options":["It was written in another language","It contained no conclusion","It studied a different group"],"optionsZh":["用另一种语言写成","没有结论","研究了不同的人群"],"answer":2,"explanation":"文中说newer study described a different group of people。","tag":"reading"},{"prompt":"What lesson did Arun learn?","promptZh":"阿伦学到了什么？","options":["A source must be understood within its limits","Old sources are always useless","Online information should never be used"],"optionsZh":["要在资料的局限范围内理解它","旧资料总是没用","绝不能使用网络信息"],"answer":0,"explanation":"结尾强调要了解来源具体能支持什么，而非简单贴上好坏标签。","tag":"reading"}],"level":"基础衔接 · 原创模拟","topic":"信息素养与资料核查"},"listening":{"title":"Advice from the Librarian","titleZh":"图书管理员的建议","passage":"If you are starting your first research report, do not search the whole internet at once. Begin with the library database and use two or three clear key words. Read the title and summary before downloading an article. Then check the author's name, the publication date, and the reference list. If you need help, bring your topic to the information desk.","passageZh":"如果你正开始第一份研究报告，不要一上来就搜索整个互联网。先使用图书馆数据库，输入两三个明确的关键词。下载文章前阅读标题和摘要，然后检查作者姓名、发表日期和参考文献表。如需帮助，请带着你的主题到咨询台。","dictation":["Begin with the library database.","Check the author's name and the publication date."],"dictationZh":["先从图书馆数据库开始。","检查作者姓名和发表日期。"],"questions":[{"prompt":"Where should students begin their search?","promptZh":"学生应从哪里开始检索？","options":["A social media page","The library database","A bookshop"],"optionsZh":["社交媒体页面","图书馆数据库","书店"],"answer":1,"explanation":"通知明确建议Begin with the library database。","tag":"listeningChoice"},{"prompt":"What should students read before downloading an article?","promptZh":"下载文章前学生应阅读什么？","options":["The title and summary","Every reference in full","Only the author's address"],"optionsZh":["标题和摘要","每条参考资料全文","只有作者地址"],"answer":0,"explanation":"原文顺序是先读title and summary，再决定是否下载。","tag":"listeningChoice"}],"level":"基础衔接短听力 · 合成朗读","tip":"先听行动顺序：begin、read、check；第二遍补充每一步的对象。"},"sent":{"text":"A report that provides recent evidence is usually more useful for a current debate.","main":"A report is usually more useful for a current debate.","translation":"一份提供近期证据的报告通常对当前讨论更有用。","core":["report","is","more","useful"],"keywords":["报告","近期证据","当前讨论","更有用"],"structure":"that provides recent evidence修饰report；主句谓语是is，more useful作表语。","mainZh":"一份提供近期证据的报告通常对当前讨论更有用。","level":"基础衔接句法","topic":"定语从句与be动词","grammar":["先把that provides recent evidence视为修饰信息。","主干A report is more useful中，形容词useful前的is不能漏。"],"examTip":"遇到that先确认它是否引导定语从句，再向后寻找真正的主句谓语。"},"trans":[{"source":"可靠的论点需要清楚的证据。","answer":"A reliable argument needs clear evidence.","keywords":["reliable argument","needs","clear evidence"],"grammar":"主语argument是单数，一般现在时谓语用needs；evidence通常不可数。","acceptedAnswers":["A reliable argument needs clear evidence.","A sound argument requires clear evidence."],"level":"基础衔接表达","topic":"资料与论证","chunks":["a reliable argument","need clear evidence"],"alternative":"A sound argument requires clear evidence."},{"source":"使用这篇文章前，我们核查了作者和发表日期。","answer":"Before using the article, we checked the author and the publication date.","keywords":["before using","checked","author","publication date"],"grammar":"介词before后接using；主要动作发生在过去，用checked。","acceptedAnswers":["Before using the article, we checked the author and the publication date.","We checked the author hat require more time ___ marked in red.","promptZh":"需要更多时间的任务用红色标出。","options":["is","are","was","be"],"optionsZh":["单数现在时","复数现在时","单数过去时","原形"],"answer":1,"explanation":"主句主语tasks是复数；that require more time只是修饰部分，因此用are。","tag":"main-verb"},{"prompt":"Our leader asked us ___ the schedule before the meeting.","promptZh":"组长让我们在会议前检查日程。","options":["check","checked","checking","to check"],"optionsZh":["原形","过去式","动名词","不定式"],"answer":3,"explanation":"ask somebody to do something，故用to check。","tag":"word-form"},{"prompt":"If a member cannot finish on time, they should ___ the group early.","promptZh":"如果成员不能按时完成，应尽早通知小组。","options":["tell","tells","told","telling"],"optionsZh":["原形","第三人称单数","过去式","动名词"],"answer":0,"explanation":"情态动词should后用动词原形tell。","tag":"modal"},{"prompt":"We divided the project ___ four smaller tasks.","promptZh":"我们把项目分成了四个较小的任务。","options":["into","from","with","by"],"optionsZh":["分成","来自","和","通过"],"answer":0,"explanation":"divide something into parts表示“把某物分成若干部分”。","tag":"preposition"},{"prompt":"Working together does not mean ___ the same thing at the same time.","promptZh":"一起合作并不意味着所有人同时做同一件事。","options":["do","does","did","doing"],"optionsZh":["原形","第三人称单数","过去式","动名词"],"answer":3,"explanation":"mean doing表示“意味着做某事”。","tag":"word-form"}],"reading":{"title":"The Empty Final Slide","titleZh":"空白的最后一页幻灯片","passage":"Four students were preparing a presentation about local transport. At their first meeting, they discussed many ideas but did not assign clear roles. Everyone assumed that someone else would design the final slide, which needed to summarize their suggestions. Two days before the deadline, the slide was still empty. Instead of blaming one another, the group listed every unfinished task. Nadia agreed to create the final slide, while Leo checked the data and Kim corrected the language. Their leader, Bo, changed the schedule so that they could review the complete presentation the next evening. They also began using a shared table with each task, its owner, and its deadline. The project was submitted on time. More importantly, the group learned that cooperation requires visible responsibilities, not simply friendly discussion.","passageZh":"四名学生正在准备一场关于本地交通的展示。第一次开会时，他们讨论了许多想法，却没有明确分工。每个人都以为别人会制作总结建议的最后一页幻灯片。截止日期前两天，那一页仍是空白。大家没有互相责怪，而是列出所有未完成任务。纳迪娅负责最后一页，利奥核对数据，金修改语言，组长博调整日程，以便第二天晚上审阅完整展示。他们还开始使用共享表格，标明每项任务、负责人和截止日期。项目按时提交。更重要的是，他们明白合作需要清晰可见的责任，而不只是友好讨论。","questions":[{"prompt":"Why was the final slide still empty?","promptZh":"为什么最后一页幻灯片仍是空白？","options":["No one had a computer","Roles had not been clearly assigned","The transport data was secret"],"optionsZh":["没人有电脑","职责没有明确分配","交通数据是保密的"],"answer":1,"explanation":"小组讨论了想法，但没有assign clear roles，大家都以为别人会做。","tag":"reading"},{"prompt":"What did the group do first after finding the problem?","promptZh":"发现问题后，小组首先做了什么？","options":["Listed unfinished tasks","Cancelled the project","Asked for a new topic"],"optionsZh":["列出未完成任务","取消项目","申请新主题"],"answer":0,"explanation":"文中Instead of blaming...后写道他们列出了所有未完成任务。","tag":"reading"},{"prompt":"What information was included in the shared table?","promptZh":"共享表格包括哪些信息？","options":["Only students' phone numbers","The teacher's private notes","Each task, owner, and deadline"],"optionsZh":["只有学生电话号码","老师的私人笔记","每项任务、负责人和截止日期"],"answer":2,"explanation":"倒数第二句前明确列出task, owner, and deadline。","tag":"reading"},{"prompt":"What did the group mainly learn?","promptZh":"这个小组主要学到了什么？","options":["Clear responsibilities support cooperation","Friendly discussion is a waste of time","One leader should do every task"],"optionsZh":["明确责任有助于合作","友好讨论浪费时间","组长应完成所有任务"],"answer":0,"explanation":"结尾指出合作需要visible responsibilities。","tag":"reading"}],"level":"基础衔接 · 原创模拟","topic":"团队合作与项目管理"},"listening":{"title":"Planning the Group Meeting","titleZh":"安排小组会议","passage":"Before we finish today's meeting, let us confirm the schedule. Sara will complete the survey questions by Thursday noon. Ming will contact ten students and collect their answers by Saturday. I will organize the results on Sunday morning. Please put your work in the shared folder as soon as it is ready. We will meet online at seven on Sunday evening to prepare the final report.","passageZh":"今天会议结束前，我们确认一下日程。萨拉将在周四中午前完成调查问题；明将在周六前联系十名学生并收集回答；我将在周日上午整理结果。工作一完成就请放进共享文件夹。我们周日晚七点在线开会，准备最终报告。","dictation":["Please put your work in the shared folder.","We will meet online at seven on Sunday evening."],"dictationZh":["请把你的工作放进共享文件夹。","我们将在周日晚七点在线开会。"],"questions":[{"prompt":"Who will collect students' answers?","promptZh":"谁将收集学生的回答？","options":["Sara","Ming","The speaker"],"optionsZh":["萨拉","明","说话者"],"answer":1,"explanation":"Ming will contact ten students and collect their answers。","tag":"listeningChoice"},{"prompt":"What will happen on Sunday evening?","promptZh":"周日晚上会发生什么？","options":["An online meeting","A classroom survey","A library lecture"],"optionsZh":["在线会议","课堂调查","图书馆讲座"],"answer":0,"explanation":"最后一句说明周日晚七点在线开会。","tag":"listeningChoice"}],"level":"基础衔接短听力 · 合成朗读","tip":"先画三行表格，记录人物、任务、截止时间；第二遍核对星期和时段。"},"sent":{"text":"Members who report problems early give the whole team more time to respond.","main":"Members give the whole team more time to respond.","translation":"及早报告问题的成员能给整个团队留下更多应对时间。","core":["members","give","team","more","time"],"keywords":["成员","及早报告","整个团队","应对时间"],"structure":"who report problems early修饰Members；主句谓语give，宾语是the whole team和more time。","mainZh":"及早报告问题的成员能给整个团队留下更多应对时间。","level":"基础衔接句法","topic":"定语从句与双宾语","grammar":["括起who引导的修饰部分后，主干是Members give the team more time。","to respond说明more time的用途。"],"examTip":"看到句中两个动词时，先判断其中一个是否位于who从句内。"},"trans":[{"source":"每位成员都负责一项明确的任务。","answer":"Each member is responsible for a clear task.","keywords":["each member","is responsible for","clear task"],"grammar":"Each member按单数处理；be responsible for是固定搭配。","acceptedAnswers":["Each member is responsible for a clear task.","Every member is responsible for a specific task."],"level":"基础衔接表达","topic":"项目分工","chunks":["each member","be responsible for","a clear task"],"alternative":"Every member is responsible for a specific task."},{"source":"如果我们遵守日程，就能按时完成项目。","answer":"If we follow the schedule, we can finish the project on time.","keywords":["if","follow the schedule","finish the project","on time"],"grammar":"真实条件句可用If加一般现在时，主句用can加动词原形。","acceptedAnswers":["If we follow the schedule, we can finish the project on time.","We can complete the project on time if we follow the schedule."],"level":"基础衔接表达","topic":"日程与截止时间","chunks":["follow the schedule","finish the project","on time"],"alternative":"We can complete the project on time if we follow the schedule."}]},"2026-09-24":{"title":"阶段复盘：用依据定位答案","grammarTip":"今天不加新词。每题都写出时间词、主句主语或原文定位句；正确答案也要说明依据，避免只凭熟悉感选择。","words":[],"grammar":[{"prompt":"The article that we discussed yesterday ___ three useful examples.","promptZh":"我们昨天讨论的那篇文章包含三个有用的例子。","options":["include","includes","including","to include"],"optionsZh":["原形","第三人称单数","现在分词","不定式"],"answer":1,"explanation":"that we discussed yesterday修饰article；主句主语article是单数，谓语用includes。","tag":"main-verb"},{"prompt":"Each of the notes ___ a date and a source.","promptZh":"每条笔记都有日期和来源。","options":["have","has","having","are having"],"optionsZh":["原形","第三人称单数","动名词","现在进行时"],"answer":1,"explanation":"Each of...按单数处理，用has。","tag":"subject-verb"},{"prompt":"The report ___ by the student team last Friday.","promptZh":"这份报告由学生团队在上周五提交。","options":["submitted","was submitted","is submitting","submit"],"optionsZh":["主动过去式","一般过去时被动","现在进行时","原形"],"answer":1,"explanation":"report与submit是被动关系，last Friday提示过去，用was submitted。","tag":"passive"},{"prompt":"You should ___ the evidence before accepting the conclusion.","promptZh":"接受结论前，你应该核查证据。","options":["check","checks","checked","checking"],"optionsZh":["原形","第三人称单数","过去式","动名词"],"answer":0,"explanation":"should后接动词原形check。","tag":"modal"},{"prompt":"The team changed its plan ___ one member was ill.","promptZh":"因为一名成员生病，小组调 法集中注意力而短暂散步。","options":["because","although","unless","while"],"optionsZh":["因为","尽管","除非","当……时"],"answer":0,"explanation":"后半句说明散步的原因，用because。","tag":"connector"},{"prompt":"Instead of ___ another sweet drink, she chose water.","promptZh":"她没有再喝一杯甜饮料，而是选择了水。","options":["buy","buys","bought","buying"],"optionsZh":["原形","第三人称单数","过去式","动名词"],"answer":3,"explanation":"介词短语instead of后接动名词buying。","tag":"word-form"},{"prompt":"A ten-minute break may be enough ___ your attention.","promptZh":"十分钟的休息可能足以恢复你的注意力。","options":["restore","restores","to restore","restoring"],"optionsZh":["原形","第三人称单数","不定式","动名词"],"answer":2,"explanation":"enough后接to do表示“足以做某事”。","tag":"word-form"},{"prompt":"The new routine not only reduced stress ___ also improved her sleep.","promptZh":"新的日常安排不仅减轻了压力，也改善了她的睡眠。","options":["and","but","or","because"],"optionsZh":["并且","而且","或者","因为"],"answer":1,"explanation":"not only...but also...是固定搭配。","tag":"connector"}],"reading":{"title":"The Afternoon Energy Experiment","titleZh":"午后精力小实验","passage":"Every afternoon, Daria felt sleepy during her two o'clock class. She assumed that the subject was boring and began buying a large sweet drink before class. The drink made her feel active for a short time, but an hour later she was tired again. For one week, Daria kept a simple record of her sleep, meals, drinks, and concentration. She noticed that the worst afternoons usually followed nights of less than six hours of sleep or mornings when she skipped breakfast. The next week, she changed three things: she went to bed at a regular time, ate a small breakfast, and carried water. Her class did not become easier, yet she could follow the discussion for longer. Daria's experiment did not prove that one routine works for everyone. It did show her that blaming the subject had hidden several habits she could change.","passageZh":"达莉娅每天下午两点上课时都犯困。她以为课程太无聊，开始课前买大杯甜饮料。饮料让她短时间精神起来，一小时后却又疲倦。她连续一周简单记录睡眠、进餐、饮料和专注情况，发现最糟糕的下午通常出现在睡眠不足六小时的夜晚之后，或没吃早餐的早晨之后。第二周她做了三项改变：规律睡觉、吃少量早餐、随身带水。课程没有变简单，但她能更久地跟上讨论。这个实验不能证明同一套习惯适合所有人，却让她看到，责怪课程掩盖了几个自己可以改变的习惯。","questions":[{"prompt":"What did Daria first think caused her sleepiness?","promptZh":"达莉娅起初认为是什么导致她犯困？","options":["The boring subject","The classroom light","Her long journey"],"optionsZh":["无聊的课程","教室灯光","漫长的路程"],"answer":0,"explanation":"第二句说明她assumed that the subject was boring。","tag":"reading"},{"prompt":"How long did the sweet drink help her feel active?","promptZh":"甜饮料让她精神了多久？","options":["For the whole day","For a short time","For an entire week"],"optionsZh":["一整天","短时间","整整一周"],"answer":1,"explanation":"文中明确说for a short time。","tag":"reading"},{"prompt":"What did Daria carry during the second week?","promptZh":"第二周达莉娅随身带了什么？","options":["A second textbook","A sleep machine","Water"],"optionsZh":["第二本教材","睡眠机器","水"],"answer":2,"explanation":"三项改变中的第三项是carried water。","tag":"reading"},{"prompt":"What is the most reasonable conclusion from her experiment?","promptZh":"从她的实验中最合理的结论是什么？","options":["Several changeable habits affected her attention","Sweet drinks always improve study","Every student needs the same routine"],"optionsZh":["几个可改变的习惯影响了她的注意力","甜饮料总能改善学习","每个学生都需要同样的作息"],"answer":0,"explanation":"结尾谨慎说明只显示她自己的多个习惯可调整，并未推广到所有人。","tag":"reading"}],"level":"基础衔接 · 原创模拟","topic":"健康习惯与学习效率"},"listening":{"title":"A Short Campus Health Workshop","titleZh":"校园健康短讲座","passage":"The student health center will offer a forty-minute workshop at six on Tuesday evening. A nutrition adviser will explain how regular meals, water, and sleep can affect concentration. This is not a cooking class, and no food will be served. Please bring a record of one normal study day if you want personal suggestions. The workshop is free, but you need to register online by Monday.","passageZh":"学生健康中心将于周二晚六点举办一场四十分钟的讲座。营养顾问会解释规律进餐、饮水和睡眠如何影响注意力。这不是烹饪课，也不提供食物。如想获得个人建议，请带一份普通学习日的记录。讲座免费，但需在周一前网上报名。","dictation":["The workshop is free, but you need to register online.","Please bring a record of one normal study day."],"dictationZh":["讲座免费，但你需要在线报名。","请带一份普通学习日的记录。"],"questions":[{"prompt":"What will the adviser discuss?","promptZh":"顾问将讨论什么？","options":["The price of textbooks","Habits that affect concentration","Ways to cook for a large group"],"optionsZh":["教材价格","影响注意力的习惯","为大群人做饭的方法"],"answer":1,"explanation":"讲座内容是进餐、饮水、睡眠与concentration的关系。","tag":"listeningChoice"},{"prompt":"What must students do by Monday?","promptZh":"学生必须在周一前做什么？","options":["Register online","Prepare a meal","Visit the classroom"],"optionsZh":["在线报名","准备一餐","参观教室"],"answer":0,"explanation":"末句说明need to register online by Monday。","tag":"listeningChoice"}],"level":"基础衔接短听力 · 合成朗读","tip":"注意排除项：免费不等于无需报名，健康讲座也不等于烹饪课。"},"sent":{"text":"Students who maintain regular routines often find it easier to concentrate in class.","main":"Students often find it easier to concentrate in class.","translation":"保持规律作息的学生通常会发现，在课堂上集中注意力更容易。","core":["students","find","easier","concentrate"],"keywords":["学生","规律作息","更容易","集中注意力"],"structure":"who maintain regular routines修饰Students；主句谓语find，it是形式宾语，to concentrate是真正内容。","mainZh":"保持规律作息的学生通常会发现，在课堂上集中注意力更容易。","level":"基础衔接句法","topic":"定语从句与形式宾语","grammar":["先得到主干Students find it easier。","to concentrate in class说明“什么事情更容易”。"],"examTip":"it不一定指代前文事物；在find it加形容词加to do结构中，它常是形式宾语。"},"trans":[{"source":"规律休息可以帮助我们减轻压力。","answer":"Regular breaks can help us reduce stress.","keywords":["regular breaks","can help","reduce stress"],"grammar":"情态动词can后用help原形；help somebody do后用reduce原形。","acceptedAnswers":["Regular breaks can help us reduce stress.","Taking regular breaks can help us reduce stress."],"level":"基础衔接表达","topic":"健康与效率","chunks":["regular breaks","help us reduce stress"],"alternative":"Taking regular breaks can help us reduce stress."},{"source":"睡眠不足时，我很难集中注意力。","answer":"When I do not get enough sleep, it is difficult for me to concentrate.","keywords":["when","not get enough sleep","difficult","concentrate"],"grammar":"When从句用一般现在时；it is difficult f rinted guide to local bus routes. One resident also pointed out that some neighbors did not own smartphones. The club divided into two teams. One created a small digital-skills workshop, and the other collected useful telephone numbers and transport information for a paper guide. More residents participated in the revised program. The students learned that useful service begins with questions, because a solution designed without local voices may solve the wrong problem.","passageZh":"某大学志愿者社团原计划教老年居民使用购物应用，学生准备了详细幻灯片，预计会有很多人参加。然而第一次社区会议上只有六人对课程感兴趣。志愿者没有取消项目，而是询问居民真正需要什么帮助。有人想学网上预约就医，有人需要简单的本地公交纸质指南，还有居民指出部分邻居没有智能手机。社团分成两组：一组开设小型数字技能课，另一组收集有用电话号码和交通信息，制作纸质指南。调整后的项目吸引了更多居民。学生明白，有用的服务始于提问，因为没有当地声音参与设计的方案可能解决错问题。","questions":[{"prompt":"What did the club originally plan to teach?","promptZh":"社团最初计划教授什么？","options":["Using shopping apps","Writing academic reports","Repairing bicycles"],"optionsZh":["使用购物应用","写学术报告","修理自行车"],"answer":0,"explanation":"首句明确说明原计划教older residents使用shopping apps。","tag":"reading"},{"prompt":"Why did the volunteers question residents?","promptZh":"志愿者为什么询问居民？","options":["To sell them phones","To learn their actual needs","To choose a club leader"],"optionsZh":["向他们卖手机","了解他们的实际需求","选择社团负责人"],"answer":1,"explanation":"参与人数少后，他们询问居民真正需要何种帮助。","tag":"reading"},{"prompt":"What did one team put in a paper guide?","promptZh":"其中一组在纸质指南中放入了什么？","options":["Shopping advertisements","Student examination scores","Phone numbers and transport information"],"optionsZh":["购物广告","学生考试成绩","电话号码和交通信息"],"answer":2,"explanation":"文中直接列出useful telephone numbers and transport information。","tag":"reading"},{"prompt":"What is the passage's main message?","promptZh":"文章主要传达什么？","options":["Effective service should begin by listening","Digital tools solve every problem","Small audiences make projects useless"],"optionsZh":["有效服务应从倾听开始","数字工具能解决所有问题","听众少会使项目毫无价值"],"answer":0,"explanation":"标题和结尾都强调先询问、倾听真实需求。","tag":"reading"}],"level":"基础衔接 · 原创模拟","topic":"志愿服务与社区需求"},"listening":{"title":"Saturday Park Activity","titleZh":"周六公园活动通知","passage":"Thank you for volunteering at River Park this Saturday. Please meet beside the east gate at eight thirty, not at the visitor center. The organizer will provide gloves and rubbish bags, but you should bring water and wear closed shoes. After a short safety talk, one team will collect litter while another records damaged signs. The activity will end at eleven.","passageZh":"感谢你报名参加本周六河滨公园志愿活动。请八点半在东门旁集合，不是在游客中心。组织者会提供手套和垃圾袋，但你应自带水并穿包脚鞋。简短安全说明后，一组捡垃圾，另一组记录损坏的标牌。活动十一点结束。","dictation":["Please meet beside the east gate at eight thirty.","The organizer will provide gloves and rubbish bags."],"dictationZh":["请八点半在东门旁集合。","组织者将提供手套和垃圾袋。"],"questions":[{"prompt":"Where should volunteers meet?","promptZh":"志愿者应在哪里集合？","options":["Beside the east gate","At the visitor center","Inside the library"],"optionsZh":["东门旁","游客中心","图书馆内"],"answer":0,"explanation":"通知用not排除了visitor center，正确地点是east gate。","tag":"listeningChoice"},{"prompt":"What should volunteers bring themselves?","promptZh":"志愿者应该自己带什么？","options":["Rubbish bags","Water","Damaged signs"],"optionsZh":["垃圾袋","水","损坏的标牌"],"answer":1,"explanation":"手套和垃圾袋由组织者提供，志愿者自己带water。","tag":"listeningChoice"}],"level":"基础衔接短听力 · 合成朗读","tip":"特别注意转折与否定：集合地点不是游客中心；区分“提供”和“自带”。"},"sent":{"text":"Projects that respond to residents' actual needs are more likely to benefit the whole community.","main":"Projects are more likely to benefit the whole community.","translation":"回应居民实际需求的项目更有可能使整个社区受益。","core":["projects","are","more","likely","benefit"],"keywords":["项目","居民实际需求","更有可能","整个社区受益"],"structure":"that respond to residents' actual needs修饰Projects；主句为Projects are more likely，to benefit补足likely。","mainZh":"回应居民实际需求的项目更有可能使整个社区受益。","level":"基础衔接句法","topic":"定语从句与不定式","grammar":["that从句说明是哪类projects。","主句形容词结构are more likely中be动词不能省略。"],"examTip":"先译主干“项目更可能……”，再把that从句前置成中文修饰语。"},"trans":[{"source":"活动由当地学生志愿者组织。","answer":"The activity was organized by local student volunteers.","keywords":["activity","was organized","by","student volunteers"],"grammar":"活动与组织是被动关系，用was organized by。","acceptedAnswers":["The activity was organized by local student volunteers.","The event was organized by local student volunteers."],"level":"基础衔接表达","topic":"志愿服务","chunks":["the activity","was organized by","student volunteers"],"alternative":"The event was organized by local student volunteers."},{"source":"提供帮助前，我们应该先了解居民的实际需要。","answer":"Before offering help, we should first understand residents' actual needs.","keywords":["before offering help","should","understand","actual needs"],"grammar":"Before后接offering；should后接understand原形。","acceptedAnswers":["Before offering help, we should first understand residents' actual needs.","We should understand what residents actually need before offering help."],"level":"基础衔接表达","topic":"社区需求","chunks":["before offering help","understand residents' actual needs"],"alternative":"We should understand what residents actually need before offering help."}]},"2026-09-27":{"title":"校园环保：用数据判断措施是否有效","grammarTip":"不可数名词waste、information作主语时通常用单数谓语；比较数量时注意fewer修饰可数名词、less修饰不可数名词。","words":[{"word":"consume","phonetic":"/kənˈsum/","meaning":"消耗；消费","phrase":"consume time","example":"Single-use products consume natural resources.","exampleZh":"一次性产品消耗自然资源。"},{"word":"consequence","phonetic":"/ˈkɑnsəkwəns/","meaning":"结果；后果","phrase":"as a consequence","example":"More waste is a consequence of careless consumption.","exampleZh":"更多垃圾是粗心消费的后果。"},{"word":"crucial","phonetic":"/ˈkruʃəl/","meaning":"至关重要的","phrase":"be crucial to","example":"Student participation is crucial to the campaign.","exampleZh":"学生参与对这项活动至关重要。"},{"word":"decline","phonetic":"/dɪˈklaɪn/","meaning":"下降；拒绝","phrase":"a decline in","example":"Plastic use began to decline after the new rule.","exampleZh":"新规定实施后塑料使用开始下降。"},{"word":"plastic","phonetic":"/ˈplæstɪk/","meaning":"塑料；塑料的","phrase":"single-use plastic","example":"The shop uses less single-use plastic.","exampleZh":"这家商店使用更少的一次性塑料。"},{"word":"encourage","phonetic":"/ɪnˈkɝɪdʒ/","meaning":"鼓励；促进","phrase":"encourage students to act","example":"Clear signs encourage students to recycle.","exampleZh":"清楚的标志鼓励学生回收物品。"},{"word":"convenient","phonetic":"/kənˈvinjənt/","meaning":"方便的；便利的","phrase":"a convenient location","example":"The bin is in a convenient location.","exampleZh":"这个垃圾桶位于方便的位置。"},{"word":"measure","phonetic":"/ˈmɛʒɚ/","meaning":"措施；测量","phrase":"measure the result","example":"The team measured the result after one month.","exampleZh":"团队在一个月后测量了结果。"}],"grammar":[{"prompt":"Food waste ___ still a serious problem in the dining hall.","promptZh":"食物浪费仍是食堂里的一个严重问题。","options":["is","are","be","were"],"optionsZh":["单数现在时","复数现在时","原形","复数过去时"],"answer":0,"explanation":"waste在此为不可数名词，谓语用is。","tag":"subject-verb"},{"prompt":"Bins that have clear labels ___ easier to use correctly.","promptZh":"标签清楚的垃圾桶更容易被正确使用。","options":["is","are","was","be"],"optionsZh":["单数现在时","复数现在时","单数过去时","原形"],"answer":1,"explanation":"主句主语Bins为复数；that从句只是修饰，主句谓语用are。","tag":"main-verb"},{"prompt":"The university introduced ___ plastic cups this month.","promptZh":"本月大学引入了更少的塑料杯。","options":["less","fewer","little","much"],"optionsZh":["较少（不可数）","较少（可数）","很少（不可数）","很多（不可数）"],"answer":1,"explanation":"cups是可数名词复数，用fewer。","tag":"quantifier"},{"prompt":"Students are encouraged ___ their own bottles.","promptZh":"学校鼓励学生自带水瓶。","options":["bring","brought","bringing","to bring"],"optionsZh":["原形","过去式","动名词","不定式"],"answer":3,"explanation":"be encouraged to do表示“被鼓励做某事”。","tag":"passive"},{"prompt":"The plan will not work ___ the bins are easy to find.","promptZh":"除非垃圾桶容易找到，否则计划不会奏效。","options":["because","although","unless","so"],"optionsZh":["因为","尽管","除非","所以"],"answer":2,"explanation":"主句含not，后面给必要条件，用unless。","tag":"connector"},{"prompt":"The team measured the waste before ___ a conclusion.","promptZh":"团队在得出结论前测量了废弃物。","options":["draw","draws","drew","drawing"],"optionsZh":["原形","第三人称单数","过去式","动名词"],"answer":3,"explanation":"介词before后接动名词drawing；draw a conclusion是固定搭配。","tag":"word-form"}],"reading":{"title":"Did the Reusable Cup Plan Work?","titleZh":"可重复使用杯计划有效吗","passage":"A campus cafe offered a small discount to customers who brought reusable cups. After one month, the manager announced that the plan was a success because the cafe had given 600 discounts. A student environment group asked for more information. They found that several regular customers had used the discount many times, so 600 discounts did not mean 600 different people had changed their behavior. The group then counted all drinks sold during two similar weeks. Reusable cups were used for 18 percent of drinks before the plan and 27 percent afterward. This was a clear increase, but most drinks still came in disposable cups. The students recommended keeping the discount and placing a washing station near the cafe. They also suggested measuring the result again during a busier month. Their conclusion was positive but careful: the measure helped, although there was room for further improvement.","passageZh":"校园咖啡店给自带可重复使用杯的顾客小额优惠。一个月后，经理宣布计划成功，因为店里发出了600次优惠。学生环保小组要求更多信息。他们发现一些常客多次使用优惠，因此600次并不等于600个不同的人改变了行为。随后小组比较了两个相近日子里售出的全部饮料。计划前可重复使用杯占18%，计划后占27%。这是明显增长，但大多数饮料仍使用一次性杯。学生建议保留优惠，在店旁设置清洗点，并在更繁忙的月份再次测量。结论积极但谨慎：措施有效，不过仍有改进空间。","questions":[{"prompt":"Why did the manager call the plan successful?","promptZh":"经理为什么称计划成功？","options":["The cafe had given 600 discounts","Every customer bought a new cup","Drink prices had doubled"],"optionsZh":["咖啡店发出了600次优惠","每位顾客都买了新杯子","饮料价格翻倍"],"answer":0,"explanation":"首段说明经理以600 discounts作为成功依据。","tag":"reading"},{"prompt":"Why was the number 600 potentially misleading?","promptZh":"为什么600这个数字可能产生误导？","options":["The cafe was closed","Some customers used the discount repeatedly","No drinks were sold"],"optionsZh":["咖啡店关门了","一些顾客重复使用优惠","没有卖出饮料"],"answer":1,"explanation":"同一名常客可能多次产生优惠记录。","tag":"reading"},{"prompt":"What percentage used reusable cups after the plan?","promptZh":"计划实施后，可重复使用杯占多少？","options":["18 percent","600 percent","27 percent"],"optionsZh":["18%","600%","27%"],"answer":2,"explanation":"数据明确从18 percent升到27 percent。","tag":"reading"},{"prompt":"How did the students describe the result?","promptZh":"学生怎样描述结果？","options":["Helpful but still open to improvement","A complete failure","Final proof for every cafe"],"optionsZh":["有所帮助但仍可改进","彻底失败","适用于所有咖啡店的最终证明"],"answer":0,"explanation":"结尾positive but careful，措施有效但仍有改进空间。","tag":"reading"}],"level":"基础衔接 · 原创模拟","topic":"环保措施与数据判断"},"listening":{"title":"New Recycling Bins in the Library","titleZh":"图书馆新增分类回收桶","passage":"Starting Monday, the library will use three kinds of waste bins. Blue bins are for clean paper, yellow bins are for plastic bottles, and gray bins are for other waste. Please empty any liquid before recycling a bottle. The old bins beside the front doors will be removed. New bins will be placed on every floor near the stairs, where they are easier to find.","passageZh":"从周一开始，图书馆将使用三类垃圾桶。蓝色桶放干净纸张，黄色桶放塑料瓶，灰色桶放其他废弃物。回收瓶子前请倒空液体。前门旁的旧桶将被移走，新桶会放在每层楼梯附近，更容易找到。","dictation":["Please empty any liquid before recycling a bottle.","New bins will be placed on every floor."],"dictationZh":["回收瓶子前请倒空所有液体。","每层楼都会放置新的垃圾桶。"],"questions":[{"prompt":"Which bin is for plastic bottles?","promptZh":"哪种垃圾桶用于塑料瓶？","options":["The blue bin","The yellow bin","The gray bin"],"optionsZh":["蓝色桶","黄色桶","灰色桶"],"answer":1,"explanation":"yellow bins are for plastic bottles。","tag":"listeningChoice"},{"prompt":"Where will the new bins be placed?","promptZh":"新垃圾桶会放在哪里？","options":["Near the stairs on every floor","Only outside the library","Inside the cafe kitchen"],"optionsZh":["每层楼梯附近","只在图书馆外","咖啡店厨房内"],"answer":0,"explanation":"末句给出位置on every floor near the stairs。","tag":"listeningChoice"}],"level":"基础衔接短听力 · 合成朗读","tip":"先建立颜色与物品的对应，再捕捉旧位置和新位置的变化。"},"sent":{"text":"Measures that make recycling more convenient can encourage more people to participate.","main":"Measures can encourage more people to participate.","translation":"让回收更方便的措施可以鼓励更多人参与。","core":["measures","can","encourage","people","participate"],"keywords":["措施","回收更方便","鼓励","更多人参与"],"structure":"that make recycling more convenient修饰Measures；主句谓语是can encourage。","mainZh":"让回收更方便的措施可以鼓励更多人参与。","level":"基础衔接句法","topic":"定语从句与情态动词","grammar":["that从句中的make不是主句谓语。","情态动词can后用encourage原形，encourage somebody to do。"],"examTip":"长句中先找情态动词，情态动词与其后的原形常共同构成主句谓语。"},"trans":[{"source":"清楚的标志可以鼓励更多学生回收塑料瓶。","answer":"Clear signs can encourage more students to recycle plastic bottles.","keywords":["clear signs","can encourage","students","recycle plastic bottles"],"grammar":"can后接encourage原形；encourage somebody to do。","acceptedAnswers":["Clear signs can encourage more students to recycle plastic bottles."],"level":"基础衔接表达","topic":"校园环保","chunks":["clear signs","encourage students to recycle","plastic bottles"],"alternative":"Clear labels can encourage more students to recycle their plastic bottles."},{"source":"得出结论前，我们应该再次测量结果。","answer":"Before drawing a conclusion, we should measure the result again.","keywords":["before drawing a conclusion","should measure","result again"],"grammar":"Before后接drawing；should后用measure原形。","acceptedAnswers":["Before drawing a conclusion, we should measure the result again.","We should measure the result again before reaching a conclusion."],"level":"基础衔接表达","topic":"数据与结论","chunks":["before drawing a conclusion","measure the result again"],"alternative":"We should measure the result again before reaching a conclusion."}]},"2026-09-28":{"title":"数字学习：管理干扰而不是排斥工具","grammarTip":"the number of加复数名词时，中心词是number，谓语用单数；by后接动名词，表示实现某事的方法。","words":[{"word":"digital","phonetic":"/ˈdɪdʒɪtəl/","meaning":"数字的；数码的","phrase":"digital learning","example":"Digital learning offers flexible ways to practise.","exampleZh":"数字学习提供灵活的练习方式。"},{"word":"function","phonetic":"/ˈfʌŋkʃən/","meaning":"功能；运转","phrase":"function as","example":"A learning app should function without constant notifications.","exampleZh":"学习应用应当在没有持续通知的情况下正常运行。"},{"word":"access","phonetic":"/ˈækˌsɛs/","meaning":"使用权；访问；获取","phrase":"access online materials","example":"Students can access the materials from home.","exampleZh":"学生可以在家获取这些材料。"},{"word":"distraction","phonetic":"/dɪˈstrækʃən/","meaning":"使人分心的事物；干扰","phrase":"avoid distractions","example":"Messages can become a major distraction.","exampleZh":"消息可能成为主要干扰。"},{"word":"ignore","phonetic":"/ˌɪɡˈnɔr/","meaning":"忽视","phrase":"ignore a warning","example":"Do not ignore signs of digital distraction.","exampleZh":"不要忽视数字干扰的迹象。"},{"word":"notification","phonetic":"/ˌnoʊtəfɪˈkeɪʃən/","meaning":"通知；提示消息","phrase":"turn off notifications","example":"She turned off unnecessary notifications.","exampleZh":"她关闭了不必要的通知。"},{"word":"limit","phonetic":"/ˈlɪmɪt/","meaning":"限制；限度","phrase":"set a time limit","example":"A time limit keeps the discussion focused.","exampleZh":"时间限制能让讨论保持重点。"},{"word":"effective","phonetic":"/ɪˈfɛktɪv/","meaning":"有效的；起作用的","phrase":"an effective strategy","example":"The strategy is simple but effective.","exampleZh":"这个策略简单却有效。"}],"grammar":[{"prompt":"The number of phone notifications ___ surprisingly high.","promptZh":"手机通知的数量高得惊人。","options":["is","are","be","were"],"optionsZh":["单数现在时","复数现在时","原形","复数过去时"],"answer":0,"explanation":"中心词是The number，按单数处理，用is。","tag":"subject-verb"},{"prompt":"Apps that send frequent messages often ___ students' attention.","promptZh":"频繁发送消息的应用常会打断学生的注意力。","options":["interrupt","interrupts","interrupted","interrupting"],"optionsZh":["原形","第三人称单数","过去式","现在分词"],"answer":0,"explanation":"主句主语Apps是复数，that从句为修饰部分，主句谓语用interrupt。","tag":"main-verb"},{"prompt":"Leo reduced distractions by ___ off unnecessary notifications.","promptZh":"利奥通过关闭不必要的通知来减少干扰。","options":["turn","turns","turned","turning"],"optionsZh":["原形","第三人称单数","过去式","动名词"],"answer":3,"explanation":"介词by后接动名词turning。","tag":"word-form"},{"prompt":"The online materials can ___ from any campus computer.","promptZh":"这些在线材料可以从任何校园电脑访问。","options":["access","be accessed","accessed","be accessing"],"optionsZh":["主动原形","被动语态","过去式","错误被动进行结构"],"answer":1,"explanation":"materials是被访问的，情态动词can后用be accessed。","tag":"passive"},{"prompt":"The tablet is useful for reading, ___ games on it can be distracting.","promptZh":"平板适合阅读，但上面的游戏可能使人分心。","options":["but","because","so","unless"],"optionsZh":["但是","因为","所以","除非"],"answer":0,"explanation":"前后是工具优点与潜在干扰的转折，用but。","tag":"connector"},{"prompt":"It is more effective ___ one clear goal for each study session.","promptZh":"每次学习设定一个明确目标会更有效。","options":["set","sets","setting","to set"],"optionsZh":["原形","第三人称单数","动名词","不定式"],"answer":3,"explanation":"It is加形容词加to do，it为形式主语，用to set。","tag":"word-form"}],"reading":{"title":"What a Screen-Time Number Cannot Tell You","titleZh":"屏幕时长数字没有告诉你的事","passage":"When Anya saw that she spent more than six hours a day on screens, she decided that all digital activity was harmful. She set a two-hour limit, but soon broke it because her classes required online readings, group messages, and video lessons. Instead of abandoning the limit completely, she examined how she used each device. She divided screen time into planned study, necessary communication, and unplanned browsing. The total number of hours changed very little during the next week, yet unplanned browsing fell by nearly half. Anya achieved this by turning off social notifications during study sessions and writing one goal before opening her laptop. She also took short breaks away from the screen. Her record taught her that a single total can hide important differences. For her, the better question was not simply how long she used a screen, but whether each period of use matched a clear purpose.","passageZh":"安雅发现自己每天看屏幕超过六小时，便认定所有数字活动都有害。她设定两小时上限，却很快打破，因为课程需要在线阅读、小组消息和视频课。她没有彻底放弃限制，而是检查每台设备的使用方式，把屏幕时间分成计划内学习、必要沟通和无计划浏览。第二周总时长变化很小，但无计划浏览减少近一半。她通过学习时关闭社交通知、打开电脑前写下一个目标来做到这一点，也会离开屏幕短暂休息。记录让她明白，单一总数会掩盖重要差异。对她而言，更好的问题不只是使用多久，而是每段使用是否服务于明确目的。","questions":[{"prompt":"Why did Anya break her original two-hour limit?","promptZh":"安雅为什么打破了最初的两小时限制？","options":["Her classes required digital activities","Her clock stopped working","She bought six new games"],"optionsZh":["课程需要数字活动","她的钟坏了","她买了六个新游戏"],"answer":0,"explanation":"课程中的online readings、messages和video lessons都需要屏幕。","tag":"reading"},{"prompt":"How did Anya classify her screen time?","promptZh":"安雅怎样给屏幕时间分类？","options":["By device price","By the purpose of each activity","By the color of each website"],"optionsZh":["按设备价格","按每项活动的目的","按网站颜色"],"answer":1,"explanation":"她按planned study、necessary communication和unplanned browsing分类。","tag":"reading"},{"prompt":"What fell by nearly half?","promptZh":"什么减少了近一半？","options":["Her class time","Necessary communication","Unplanned browsing"],"optionsZh":["她的上课时间","必要沟通","无计划浏览"],"answer":2,"explanation":"总时长变化很小，unplanned browsing下降近一半。","tag":"reading"},{"prompt":"What did Anya finally consider the better question?","promptZh":"安雅最终认为什么问题更好？","options":["Whether screen use had a clear purpose","Whether every device was new","Whether classmates used fewer apps"],"optionsZh":["屏幕使用是否有明确目的","每台设备是否都是新的","同学是否使用更少应用"],"answer":0,"explanation":"末句强调每段屏幕使用是否matched a clear purpose。","tag":"reading"}],"level":"基础衔接 · 原创模拟","topic":"数字工具与注意力管理"},"listening":{"title":"Device Rules for the Quiet Study Room","titleZh":"安静自习室设备规则","passage":"Welcome to the quiet study room on the second floor. Laptops and tablets are allowed, but all devices must remain silent. If you need to join an online meeting, please use one of the rooms across the hall. Phone calls are not permitted here. You may leave your seat for a short break, but take valuable devices with you. The room closes at ten tonight.","passageZh":"欢迎来到二楼安静自习室。这里允许使用笔记本电脑和平板，但所有设备必须保持静音。如需参加在线会议，请使用走廊对面的房间。这里不允许打电话。短暂休息时可以离开座位，但请随身带走贵重设备。自习室今晚十点关闭。","dictation":["All devices must remain silent.","Take valuable devices with you when you leave."],"dictationZh":["所有设备必须保持静音。","离开时请随身带走贵重设备。"],"questions":[{"prompt":"Where should students join an online meeting?","promptZh":"学生应在哪里参加在线会议？","options":["In a room across the hall","At any desk in the quiet room","Outside the building"],"optionsZh":["走廊对面的房间","安静自习室任意座位","楼外"],"answer":0,"explanation":"通知要求online meeting使用rooms across the hall。","tag":"listeningChoice"},{"prompt":"What should students do with valuable devices during a break?","promptZh":"休息时学生应怎样处理贵重设备？","options":["Leave them on the desk","Give them to another student","Take them along"],"optionsZh":["留在桌上","交给其他学生","随身带走"],"answer":2,"explanation":"通知明确说take valuable devices with you。","tag":"listeningChoice"}],"level":"基础衔接短听力 · 合成朗读","tip":"抓住allowed、must和not permitted，区分“允许使用设备”和“允许设备出声”。"},"sent":{"text":"Tools that provide easy access to information can also become a source of distraction.","main":"Tools can also become a source of distraction.","translation":"让人方便获取信息的工具也可能成为干扰来源。","core":["tools","can","become","source","distraction"],"keywords":["工具","方便获取信息","也可能","干扰来源"],"structure":"that provide easy access to information修饰Tools；主句谓语can become，a source of distraction作表语。","mainZh":"让人方便获取信息的工具也可能成为干扰来源。","level":"基础衔接句法","topic":"定语从句与情态动词","grammar":["that从句补充工具的功能。","can become构成主句谓语，also放在情态动词之后。"],"examTip":"六级材料常在同一句呈现优点和风险；先找主干，再判断also等逻辑词。"},"trans":[{"source":"关闭不必要的通知能帮助我集中注意力。","answer":"Turning off unnecessary notifications helps me focus.","keywords":["turning off","unnecessary notifications","helps","focus"],"grammar":"动名词短语作主语，谓语用helps；help somebody do后接focus原形。","acceptedAnswers":["Turning off unnecessary notifications helps me focus.","Turning off unnecessary notifications helps me concentrate."],"level":"基础衔接表达","topic":"数字干扰","chunks":["turn off notifications","help me focus"],"alternative":"Turning off unnecessary notifications helps me concentrate."},{"source":"数字工具只有服务于明确目的时才真正有效。","answer":"Digital tools are truly effective only when they serve a clear purpose.","keywords":["digital tools","are truly effective","only when","clear purpose"],"grammar":"主句形容词effective前要有are；only when引导条件或时间关系。","acceptedAnswers":["Digital tools are truly effective only when they serve a clear purpose.","Digital tools are effective only when they are used for a clear purpose."],"level":"基础衔接表达","topic":"有目的的学习","chunks":["digital tools","be effective","serve a clear purpose"],"alternative":"Digital tools are effective only when they are used for a clear purpose."}]},"2026-09-29":{"title":"实习准备：用具体经历证明能力","grammarTip":"apply for、prepare for是固定搭配；if引导真实条件时，从句常用一般现在时，主句可用will加动词原形。","words":[{"word":"career","phonetic":"/kəˈrɪr/","meaning":"职业；事业","phrase":"career planning","example":"Career planning begins with understanding your interests.","exampleZh":"职业规划始于了解自己的兴趣。"},{"word":"internship","phonetic":"/ˈɪntɝnˌʃɪp/","meaning":"实习；实习期","phrase":"apply for an internship","example":"She applied for a summer internship.","exampleZh":"她申请了一份暑期实习。"},{"word":"ability","phonetic":"/əˈbɪləˌti/","meaning":"能力；才能","phrase":"develop an ability","example":"The internship can show your ability to solve problems.","exampleZh":"实习能展示你解决问题的能力。"},{"word":"acquire","phonetic":"/əˈkwaɪɚ/","meaning":"获得；习得","phrase":"acquire knowledge","example":"Students acquire useful skills through practice.","exampleZh":"学生通过实践获得有用技能。"},{"word":"demonstrate","phonetic":"/ˈdɛmənˌstreɪt/","meaning":"证明；展示","phrase":"demonstrate an ability","example":"Give an example to demonstrate your communication skills.","exampleZh":"举例证明你的沟通能力。"},{"word":"appropriate","phonetic":"/əˈproʊpriət/","meaning":"合适的","phrase":"appropriate material","example":"Choose appropriate clothes for the interview.","exampleZh":"选择适合面试的衣服。"},{"word":"opportunity","phonetic":"/ˌɑpɚˈtunəti/","meaning":"机会","phrase":"a learning opportunity","example":"The internship is an opportunity to learn from practice.","exampleZh":"这份实习是从实践中学习的机会。"},{"word":"anticipate","phonetic":"/ænˈtɪsəˌpeɪt/","meaning":"预期；期待","phrase":"anticipate a problem","example":"Anticipate common questions before the interview.","exampleZh":"面试前预想常见问题。"}],"grammar":[{"prompt":"Mina plans to apply ___ an internship at a local company.","promptZh":"米娜计划申请当地公司的一份实习。","options":["at","for","with","from"],"optionsZh":["在","申请","和","来自"],"answer":1,"explanation":"apply for a job or internship表示“申请工作或实习”。","tag":"preposition"},{"prompt":"The experience that she gained from volunteering ___ useful in the interview.","promptZh":"她从志愿服务中获得的经验在面试中很有用。","options":["was","were","be","have"],"optionsZh":["单数过去时","复数过去时","原形","有"],"answer":0,"explanation":"主句主语experience在此不可数，that从句不改变主谓关系，用was。","tag":"main-verb"},{"prompt":"If you prepare specific examples, you ___ more confident.","promptZh":"如果你准备具体例子，你会更自信。","options":["feel","felt","will feel","are feeling yesterday"],"optionsZh":["一般现在时","过去式","一般将来时","错误结构"],"answer":2,"explanation":"真实条件句中if从句用一般现在时，主句可用will feel。","tag":"conditional"},{"prompt":"The workshop is designed ___ students improve their interview skills.","promptZh":"这场讲座旨在帮助学生提高面试技巧。","options":["help","helps","helping","to help"],"optionsZh":["原形","第三人称单数","动名词","不定式"],"answer":3,"explanation":"be designed to do表示“旨在做某事”。","tag":"word-form"},{"prompt":"Applicants should avoid ___ the same general answer to every question.","promptZh":"申请者应避免对每个问题都给出同样笼统的回答。","options":["give","gives","gave","giving"],"optionsZh":["原形","第三人称单数","过去式","动名词"],"answer":3,"explanation":"avoid后接动名词giving。","tag":"word-form"},{"prompt":"Her examples were brief, ___ they clearly showed her skills.","promptZh":"她的例子很简短，但清楚展示了她的技能。","options":["but","because","unless","so that"],"optionsZh":["但是","因为","除非","以便"],"answer":0,"explanation":"brief与clearly showed形成转折，用but。","tag":"connector"}],"reading":{"title":"From General Claims to Specific Examples","titleZh":"从笼统陈述到具体例子","passage":"Jun applied for several internships but received no interview invitations. His resume said that he was responsible, cooperative, and good at solving problems. A career adviser told him that these words were positive but too general. She asked Jun to provide evidence for each claim. He replaced “good at teamwork” with a short description of a class project in which he organized a shared schedule and helped the group meet its deadline. For problem-solving, he described how he noticed an error in survey data, checked the original forms, and corrected the report before submission. He also adjusted each application to match the skills named in the internship notice. A month later, Jun received two interview invitations. The adviser reminded him that the changes did not guarantee success. They simply made it easier for an employer to see what Jun had actually done and how his experience might fit the role.","passageZh":"俊申请了几份实习，却没有收到面试邀请。他的简历写着自己负责、善于合作、擅长解决问题。职业顾问告诉他，这些词虽积极却过于笼统，让他为每项说法提供证据。俊把“擅长团队合作”换成一个课堂项目实例：他整理共享日程，帮助小组按时完成。谈到解决问题时，他描述自己如何发现调查数据错误、核查原表，并在提交前改正报告。他还根据每份实习通知中的技能要求调整申请。一个月后，他收到两次面试邀请。顾问提醒，这些修改不保证成功，只是让雇主更容易看出俊实际做过什么，以及他的经历为何适合岗位。","questions":[{"prompt":"What was the main weakness of Jun's original resume?","promptZh":"俊原简历的主要弱点是什么？","options":["Its claims were too general","It was written by his teacher","It included too many dates"],"optionsZh":["陈述过于笼统","由老师代写","日期太多"],"answer":0,"explanation":"顾问认为positive but too general。","tag":"reading"},{"prompt":"How did Jun show his teamwork skill?","promptZh":"俊如何展示团队合作能力？","options":["By listing every class","By describing a project schedule and deadline","By claiming that everyone liked him"],"optionsZh":["列出每门课","描述项目日程和截止时间","声称所有人都喜欢他"],"answer":1,"explanation":"他用组织共享日程并帮助按时完成项目的具体例子。","tag":"reading"},{"prompt":"What did Jun do with each application?","promptZh":"俊怎样处理每份申请？","options":["Sent exactly the same document","Removed all examples","Matched it to the notice's skills"],"optionsZh":["发送完全相同的文件","删除所有例子","根据通知中的技能调整"],"answer":2,"explanation":"文中说he adjusted each application to match the ski function recordFirstAttempt(previous,group,id,correct,detail={}){
  if(!scoreFields[group])throw new Error('Unknown group: '+group);
  const p={...blankProgress(),...previous},key=group+':'+id;
  if(p.attempts[key])return p;
  p.attempts={...p.attempts,[key]:{...detail,group,correct:Boolean(correct)}};
  const rows=Object.values(p.attempts).filter(a=>a.group===group);
  const [c,t]=scoreFields[group];p[c]=rows.filter(a=>a.correct).length;p[t]=rows.length;
  if(['grammar','reading','vocab'].includes(group)){
    const q=Object.values(p.attempts).filter(a=>['grammar','reading','vocab'].includes(a.group));
    p.quizCorrect=q.filter(a=>a.correct).length;p.quizTotal=q.length;
  }
  if(!correct){
    const e={group,id,label:detail.label||'',tag:detail.tag||group,answer:detail.answer||'',expected:detail.expected||''};
    p.errorDetails=[...p.errorDetails,e];
    if(detail.targetWord)p.wordErrors=[...new Set([...p.wordErrors,detail.targetWord])];
    if(group==='dictation'&&detail.expected)p.listeningErrors=[...new Set([...p.listeningErrors,detail.expected])];
    if(!['word','dictation'].includes(group)&&detail.label)p.quizErrors=[...new Set([...p.quizErrors,detail.label])];
  }
  return p;
}

    function entryLabel(){if(typeof window==='undefined')return '本地页面';return window.location.protocol==='file:'?'D盘单文件':/^(localhost|127\.0\.0\.1)$/.test(window.location.hostname)?'本地服务器':'网络页面'}
    function renderSyncBar(){
      const L=lesson(),repaired=L.cacheDateMismatch||L.cacheContentMismatch,missing=RELEASE.missingDates||[],structural=!(RELEASE.duplicateReading||[]).length&&!(RELEASE.duplicateListening||[]).length&&!(RELEASE.duplicateCourse||[]).length&&!(RELEASE.dateMismatches||[]).length,integrity=structural&&!missing.length,status=integrity?'七天独立课程校验通过':structural&&missing.length?'今天可学习；'+missing.length+'个未来日期待生成':'课程结构校验未通过，请先同步';
      document.getElementById('syncBar').innerHTML='<span>入口：'+esc(entryLabel())+' · 版本 '+esc(RELEASE.version)+' / '+esc(RELEASE.buildId)+' · 核验 '+esc(RELEASE.verifiedOn)+' · 当前课程 '+selected+'</span><span>'+esc(localSyncMessage)+'</span><span>'+esc(status)+'</span>'+(repaired?'<span class="tip">已隔离错日或旧版课程缓存，当前显示 '+esc(selected)+' 的正确内容；原成绩和旧快照仍保留。</span>':'')+'<button id="backToday" class="secondary">回到今天</button><button id="refreshLocal" class="secondary">'+(latestRelease&&latestRelease.buildId!==RELEASE.buildId?'保存并载入新版本':'刷新本地内容')+'</button>';
      document.getElementById('backToday').onclick=()=>{syncCalendar();selected=today;tab='plan';reset();render()};
      document.getElementById('refreshLocal').onclick=()=>reloadLocalPage(true);
    }
    function restoreView(){
      try{const v=JSON.parse(sessionStorage.getItem('cet6-view-after-update')||'null');if(v&&/^\d{4}-\d{2}-\d{2}$/.test(v.date)&&tabs.some(x=>x[0]===v.tab)){selected=v.date;tab=v.tab}sessionStorage.removeItem('cet6-view-after-update')}catch{}
    }
    function reloadLocalPage(manual=false){
      if(typeof window==='undefined')return;
      if(!manual&&(Date.now()-lastInteraction<15000||speechSynthesis.speaking))return;
      if(!persistDraft())return;
      try{
        sessionStorage.setItem('cet6-view-after-update',JSON.stringify({date:selected,tab}));
        if(latestRelease&&latestRelease.buildId!==RELEASE.buildId){
          const retryKey='cet6-reload-attempt-'+latestRelease.buildId,retries=Number(sessionStorage.getItem(retryKey)||0);
          if(!manual&&retries>=3){localSyncMessage='新文件已就绪，但浏览器连续命中旧缓存；请点“刷新本地内容”';renderSyncBar();return}
          sessionStorage.setItem(retryKey,String(retries+1));
          const target=new URL(window.location.href);target.searchParams.set('course-build',latestRelease.buildId);
          if(typeof window.location.replace==='function')window.location.replace(target.href);else window.location.href=target.href;
          return;
        }
      }catch{}
      window.location.reload();
    }
    function syncCalendar(){
      const date=dateKey(new Date());if(date===today)return;
      const followed=selected===today;today=date;if(followed){selected=date;reset()}render();
    }
    function checkLocalRelease(done){
      if(typeof window==='undefined')return;
      if(typeof done==='function')releaseCallbacks.push(done);
      if(checkingRelease)return;
      checkingRelease=true;
      const script=document.createElement('script');
      const url=new URL('study-release.js',window.location.href);url.searchParams.set('check',String(Date.now()));
      script.src=url.href;script.async=true;
      const finish=ok=>{checkingRelease=false;script.remove();const callbacks=releaseCallbacks.splice(0);callbacks.forEach(fn=>fn(ok))};
      script.onload=()=>finish(true);
      script.onerror=()=>{localSyncMessage='未检测到版本文件，可手动刷新；不要移动单独的HTML文件';renderSyncBar();finish(false)};
      document.head.appendChild(script);
    }
    function installLocalUpdates(){
      if(typeof window==='undefined')return;
      window.__CET6ReceiveRelease=release=>{
        if(!release||!release.buildId)return;
        latestRelease=release;
        localSyncMessage=release.buildId===RELEASE.buildId?'已核对：本地最新文件':'发现新版本，停止输入后自动保存并更新';
        if(release.buildId===RELEASE.buildId)try{sessionStorage.removeItem('cet6-reload-attempt-'+release.buildId)}catch{}
        renderSyncBar();
        if(release.buildId!==RELEASE.buildId&&!releaseCallbacks.length){reloadLocalPage();setTimeout(()=>reloadLocalPage(),16000)}
      };
      document.addEventListener('input',()=>{lastInteraction=Date.now()},true);
      window.addEventListener('focus',()=>{syncCalendar();checkLocalRelease()});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncCalendar();checkLocalRelease()}});
      setTimeout(checkLocalRelease,800);
      setInterval(()=>{syncCalendar();checkLocalRelease()},60000);
    }

    function bindCommon(){document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{selected=b.dataset.course;tab='plan';reset();render()});document.querySelectorAll('[data-record-day]').forEach(b=>b.onclick=()=>{selected=b.dataset.recordDay;tab='records';reset();render()});document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()})}
    restoreView();reset();render();setInterval(syncCalendar,60000);installLocalUpdates();
  })();
  </script>
</body>
</html>
