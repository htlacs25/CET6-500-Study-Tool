"prompt":"She ___ English every morning.","promptZh":"她每天早上学英语。","options":["study","studies","studying","studied"],"optionsZh":["原形","第三人称单数","现在分词","过去式"],"answer":1,"explanation":"一般现在时，主语she为第三人称单数，用studies。","tag":"present"},{"prompt":"I enjoy ___ with my friends.","promptZh":"我喜欢和朋友一起学习。","options":["study","studying","studied","to study"],"optionsZh":["原形","动名词","过去式","不定式"],"answer":1,"explanation":"enjoy后接动名词studying。","tag":"word-form"},{"prompt":"I want ___ my English.","promptZh":"我想提高英语。","options":["improve","improving","to improve","improves"],"optionsZh":["原形","动名词","不定式","第三人称单数"],"answer":2,"explanation":"want to do表示想要做某事。","tag":"word-form"}]},{"title":"第二周小测：准备衔接","grammarTip":"不加新词；用换过的材料检查迁移。看词汇、听力理解和阅读分项表现，不用小题正确率预测六级分数。","reading":{"title":"Choosing the Next Step","titleZh":"选择下一步","passage":"After two weeks, Rosa checks three kinds of records. First, she tests whether she remembers words after a day, not just after a minute. Second, she listens to a new short conversation and answers questions without reading the text. Third, she reads a short passage and explains where she found each answer. Some tasks are now easier, but she still makes mistakes with verbs. She decides to keep a few grammar exercises in her plan. If the next week goes well, she will try slightly longer material. Her long-term goal stays the same, while the daily steps can change.","passageZh":"两周后罗莎检查三类记录：词汇隔天是否记得，而不是只看一分钟后的记忆；听一段新短对话，不看文字答题；读短文并指出每题依据。有些任务变容易了，但动词仍会错，所以保留少量语法练习。下周表现稳定就试稍长材料。长期目标不变，日常步骤可以调整。","questions":[{"prompt":"When does Rosa check word memory?","promptZh":"什么时候检查词汇记忆？","options":["After a day","Only immediately","After a year only"],"optionsZh":["隔天","只立即检查","只一年后"],"answer":0,"explanation":"强调不是只看即时记忆。","tag":"reading"},{"prompt":"How does she test listening?","promptZh":"怎样测听力？","options":["Reads all answers first","Uses a new conversation without text","Only repeats a memorized line"],"optionsZh":["先看全部答案","用新对话且不看文字","只重复背熟的句子"],"answer":1,"explanation":"用新材料检查理解。","tag":"reading"},{"prompt":"What still needs practice?","promptZh":"什么仍需练习？","options":["Book shopping","Drawing","Verbs"],"optionsZh":["买书","绘画","动词"],"answer":2,"explanation":"still makes mistakes with verbs。","tag":"reading"},{"prompt":"What stays the same?","promptZh":"什么保持不变？","options":["Her long-term goal","Every daily task","The length of every text"],"optionsZh":["长期目标","每天所有任务","每篇篇幅"],"answer":0,"explanation":"长期目标不变，日常步骤可变。","tag":"reading"}],"level":"基础恢复 · 原创模拟","topic":"校园与日常生活"},"listening":{"title":"A Review Meeting","titleZh":"复盘会","passage":"Our review meeting starts at five, but please come ten minutes early. Bring your record of old mistakes. We will listen to a new conversation and answer two questions before looking at the text. Then we will choose next week’s tasks. We are checking what to practise next, not trying to learn many new words today.","passageZh":"复盘会五点开始，请提前十分钟，带旧错记录。先听新对话、答两题，再看文字，然后选择下周任务。今天检查下一步练什么，不学大量新词。","dictation":["Bring your record of old mistakes.","We will choose next week’s tasks."],"dictationZh":["带上你的旧错记录。","我们将选择下周任务。"],"questions":[{"prompt":"When should learners arrive?","promptZh":"应该几点到？","options":["At five ten","At four fifty","At four"],"optionsZh":["五点十分","四点五十","四点"],"answer":1,"explanation":"五点提前十分钟=四点五十。","tag":"reading"},{"prompt":"What is the purpose of the meeting?","promptZh":"复盘会目的是什么？","options":["Choose future practice","Memorize many new words","Buy recordings"],"optionsZh":["选择后续练习","背大量新词","买录音"],"answer":0,"explanation":"检查下一步练什么。","tag":"reading"}],"level":"基础短听力 · 合成朗读","tip":"先听大意，再核对原文；关掉文字复听，并用简单英语回答问题。听写只做两句。"},"sent":{"text":"Students who practise regularly become more confident.","main":"Students become more confident.","translation":"经常练习的学生变得更有信心。","core":["students","become","confident"],"keywords":["学生","练习","信心"],"structure":"practise是从句谓语；主句谓语become连接状态more confident。","mainZh":"经常练习的学生变得更有信心。","level":"基础句法","topic":"主句谓语与完整句子","grammar":["先找主语与主句谓语，再处理修饰部分。","形容词作表语时，检查前面是否有be动词。"],"examTip":"先理解主干；规则匹配仅供练习，不是正式考试评分。"},"trans":[{"source":"我认为听力练习很重要。","answer":"I think listening practice is important.","keywords":["think","listening practice","is","important"],"grammar":"完整保留从句的be动词is。","acceptedAnswers":["I think listening practice is important."],"level":"基础表达","topic":"完整句子与常用搭配","chunks":["关键表达：think","关键表达：listening practice","关键表达：is","关键表达：important"],"alternative":"可采用意思一致且语法正确的表达；规则未识别时留待共同复核。"},{"source":"我昨天学习了英语，今天正在复习。","answer":"I studied English yesterday, and I am reviewing today.","keywords":["studied","yesterday","am","reviewing","today"],"grammar":"先过去式studied，再现在进行时am reviewing。","acceptedAnswers":["I studied English yesterday, and I am reviewing today.","I learned English yesterday, and I am reviewing today."],"level":"基础表达","topic":"完整句子与常用搭配","chunks":["关键表达：studied","关键表达：yesterday","关键表达：am","关键表达：reviewing","关键表达：today"],"alternative":"I learned English yesterday, and I am reviewing today."}],"id":"recovery-14","index":13,"weekly":true,"words":[],"grammar":[{"prompt":"Students who sleep well often learn better. Which is the main verb?","promptZh":"睡得好的学生通常学得更好。哪个是主句谓语？","options":["sleep","learn","well","students"],"optionsZh":["睡觉（从句谓语）","学习","好地","学生"],"answer":1,"explanation":"先括起who sleep well。主干Students learn better，learn是主句谓语。","tag":"main-verb"},{"prompt":"I think English ___ useful.","promptZh":"我认为英语很有用。","options":["is","are","be","being"],"optionsZh":["是（单数）","是（复数）","原形","动名词或分词"],"answer":0,"explanation":"English是单数；useful是形容词，前面需要is。","tag":"be-verb"},{"prompt":"She ___ a new word yesterday.","promptZh":"她昨天学了一个新词。","options":["learn","learns","learned","learning"],"optionsZh":["原形","第三人称单数","过去式","现在分词"],"answer":2,"explanation":"有yesterday，用一般过去时learned。","tag":"past"},{"prompt":"Look! She ___ a book.","promptZh":"看！她正在读书。","options":["reads","is reading","read","reading"],"optionsZh":["一般现在时","正在读","原形或过去式","只有分词"],"answer":1,"explanation":"正在进行的动作：is＋reading，不能漏is。","tag":"continuous"},{"prompt":"The book is useful, ___ it is expensive.","promptZh":"这本书很有用，但是很贵。","options":["because","but","so","if"],"optionsZh":["因为","但是","所以","如果"],"answer":1,"explanation":"前后形成转折，用but。","tag":"connector"},{"prompt":"Practice helps me ___ my English.","promptZh":"练习帮助我提高英语。","options":["imporve","improve","improved","improving"],"optionsZh":["字母顺序错误","提高","过去式","动名词或分词"],"answer":1,"explanation":"help somebody do something；注意improve中的prove顺序。","tag":"spelling"}]}],"diagnostic":{"date":"2026-08-28","source":"本次对话人工批改，不计入网页首次作答","objective":{"correct":7,"total":8},"reinforcement":{"correct":3,"total":3,"spellingErrors":["imporve → improve"]},"strengths":["4个常用词义正确","两道基础时态选择正确","讲解后能在相似句子中找到主句谓语"],"focus":["主句与定语从句的谓语区分","形容词前缺少be动词","think/thing与improve的拼写","every day与everyday的用法"],"listening":"尚未进行听力测评，不推断听力等级","examples":[{"input":"I learn English everyday,but I thing the hear so difficult","answer":"I learn English every day, but I think listening is very difficult.","zh":"我每天学习英语，但是我觉得听力很难。","explanation":"learn可以保留；every day分开；thing改think；这里用listening；形容词前加is。so difficult本身可以使用。"}]},"datedLessons":{"2026-09-11":{"title":"校园导览与方位表达","grammarTip":"先确定句子的主语和谓语，再用there be、介词和关系从句补充地点信息。注意available是形容词，前面需要be动词。","words":[{"word":"campus","phonetic":"/ˈkæmpəs/","meaning":"校园","phrase":"on campus","example":"The new library is in the center of the campus.","exampleZh":"新图书馆位于校园中央。"},{"word":"attend","phonetic":"/əˈtend/","meaning":"参加；出席","phrase":"attend a meeting","example":"All new students should attend the meeting.","exampleZh":"所有新生都应该参加会议。"},{"word":"locate","phonetic":"/ˈloʊkeɪt/","meaning":"找到……的位置；使坐落于","phrase":"be located near","example":"The language center is located near the south gate.","exampleZh":"语言中心坐落在南门附近。"},{"word":"building","phonetic":"/ˈbɪldɪŋ/","meaning":"建筑物；大楼","phrase":"office building","example":"This building has three reading rooms.","exampleZh":"这栋楼有三间阅览室。"},{"word":"entrance","phonetic":"/ˈentrəns/","meaning":"入口；进入","phrase":"main entrance","example":"Please wait for me at the main entrance.","exampleZh":"请在正门等我。"},{"word":"map","phonetic":"/mæp/","meaning":"地图","phrase":"campus map","example":"A campus map can help you find the hall.","exampleZh":"校园地图能帮你找到礼堂。"},{"word":"direction","phonetic":"/dəˈrekʃən/","meaning":"方向；指引","phrase":"ask for directions","example":"She asked a volunteer for directions.","exampleZh":"她向一名志愿者问路。"},{"word":"available","phonetic":"/əˈveɪləbəl/","meaning":"可获得的；有空的","phrase":"be available to","example":"Free study rooms are available to students.","exampleZh":"学生可以免费使用自习室。"}],"grammar":[{"prompt":"There ___ two computer rooms beside the library.","promptZh":"图书馆旁边有两间电脑室。","options":["is","are","has","be"],"optionsZh":["有（单数）","有（复数）","拥有","原形"],"answer":1,"explanation":"there be与后面的名词保持一致；two computer rooms是复数，所以用are。","tag":"be-verb"},{"prompt":"The student center is located ___ the north gate.","promptZh":"学生活动中心位于北门附近。","options":["near","during","until","without"],"optionsZh":["在……附近","在……期间","直到","没有"],"answer":0,"explanation":"表示地点接近用near。","tag":"preposition"},{"prompt":"Students who need help can ___ the information desk.","promptZh":"需要帮助的学生可以去信息台。","options":["visits","visited","visit","visiting"],"optionsZh":["第三人称单数","过去式","动词原形","现在分词"],"answer":2,"explanation":"情态动词can后接动词原形visit。","tag":"modal"},{"prompt":"The building ___ has a red door is the language center.","promptZh":"有红色门的那栋楼是语言中心。","options":["who","that","where","what"],"optionsZh":["指人","引导定语从句，指物","在哪里","什么"],"answer":1,"explanation":"先行词building指物，that在从句中作主语。","tag":"relative-clause"},{"prompt":"A map ___ available at the main entrance.","promptZh":"正门处有地图可取。","options":["am","is","are","being"],"optionsZh":["与I搭配","是（单数）","是（复数）","现在分词"],"answer":1,"explanation":"主语A map是单数，available是形容词，前面需要is。","tag":"be-verb"},{"prompt":"Which is the main verb in “The guide who welcomes new students speaks slowly” ?","promptZh":"在“The guide who welcomes new students speaks slowly”中，主句谓语是什么？","options":["welcomes","students","speaks","slowly"],"optionsZh":["欢迎（从句谓语）","学生","说（主句谓语）","慢慢地"],"answer":2,"explanation":"who welcomes new students修饰guide；主干是The guide speaks slowly。","tag":"main-verb"}],"reading":{"title":"Finding the Right Classroom","titleZh":"找到正确的教室","level":"基础衔接 · 原创模拟","topic":"校园生活与信息定位","passage":"On her first day at a new campus, Mei arrived forty minutes before class. She had saved a map on her phone, but two buildings on the map had similar names. Instead of walking around without a plan, she went to the information desk near the main entrance. A student volunteer showed her the correct building and explained that Room 204 was on the second floor. Mei repeated the directions in English: enter the building, turn left, and take the stairs. She then found the classroom with fifteen minutes to spare. Before sitting down, she took a photo of the floor guide for later use. The experience taught her that asking a clear question can be faster than guessing. It also gave her a useful chance to practise listening for numbers and directions in a real situation.","passageZh":"第一天到新校园时，梅提前四十分钟到达。她在手机里保存了地图，但地图上两栋楼的名字很相似。她没有毫无计划地四处走，而是去了正门附近的信息台。一名学生志愿者给她指出正确的大楼，并说明204教室在二楼。梅用英语重复了路线：进入大楼、左转、走楼梯。她提前十五分钟找到了教室。坐下前，她拍下楼层指引以备后用。这次经历让她明白，问一个清楚的问题往往比猜测更快，也让她在真实情境中练习了听数字和方向。","questions":[{"prompt":"Why was Mei unsure about where to go?","promptZh":"梅为什么不确定该往哪里走？","options":["She had no phone","Two buildings had similar names","The entrance was closed","Her class was cancelled"],"optionsZh":["她没有手机","两栋楼名字相似","入口关闭了","课程取消了"],"answer":1,"explanation":"第二句说明地图上两栋楼的名字相似。","tag":"reading"},{"prompt":"Who gave Mei the directions?","promptZh":"谁给梅指了路？","options":["A student volunteer","Her English teacher","A bus driver","A shop assistant"],"optionsZh":["学生志愿者","英语老师","公交司机","店员"],"answer":0,"explanation":"定位A student volunteer showed her the correct building。","tag":"reading"},{"prompt":"What did Mei do before she sat down?","promptZh":"梅坐下前做了什么？","options":["She called home","She changed classrooms","She photographed the floor guide","She returned to the entrance"],"optionsZh":["给家里打电话","换教室","拍下楼层指引","回到入口"],"answer":2,"explanation":"原文明确说她拍了楼层指引的照片。","tag":"reading"},{"prompt":"What lesson did Mei learn?","promptZh":"梅学到了什么？","options":["Guessing is always quicker","Maps are never useful","Clear questions can save time","Students should arrive after class begins"],"optionsZh":["猜测总是更快","地图从来没用","清楚提问可以节省时间","学生应在上课后到达"],"answer":2,"explanation":"倒数第二句概括了她的体会。","tag":"reading"}]},"listening":{"title":"A Change of Classroom","titleZh":"教室变更通知","level":"基础衔接短听力 · 合成朗读","tip":"首遍抓地点变化和时间，第二遍记录楼号、房间号与方位词。","passage":"Attention, students. This afternoon's study-skills class will not meet in Room 210. Please go to Room 315 in the science building instead. The science building is across from the library, and its west entrance is open. Class still begins at two thirty, so arrive five minutes early and bring your campus map if you need it.","passageZh":"同学们请注意，今天下午的学习技能课不在210教室上课，请改到科学楼315教室。科学楼在图书馆对面，西门开放。课程仍在两点半开始，请提前五分钟到；如有需要，请带校园地图。","dictation":["Please go to Room 315 in the science building instead.","Class still begins at two thirty."],"dictationZh":["请改到科学楼315教室。","课程仍在两点半开始。"],"questions":[{"prompt":"Where will the class meet?","promptZh":"课程将在哪里进行？","options":["Room 210","Room 315","The library","The main entrance"],"optionsZh":["210教室","315教室","图书馆","正门"],"answer":1,"explanation":"原地点210被否定，新地点是science building的315。","tag":"listeningChoice"},{"prompt":"What has not changed?","promptZh":"什么没有改变？","options":["The room","The building","The starting time","The entrance"],"optionsZh":["教室","大楼","开始时间","入口"],"answer":2,"explanation":"Class still begins at two thirty说明开始时间不变。","tag":"listeningChoice"}]},"sent":{"text":"Students who cannot locate the classroom should ask for directions.","main":"Students should ask for directions.","translation":"找不到教室的学生应该问路。","core":["students","should","ask","directions"],"keywords":["学生","教室","问路"],"structure":"who cannot locate the classroom是修饰Students的定语从句；主句谓语是should ask。","mainZh":"学生应该问路。","level":"基础衔接句法","topic":"定语从句与情态动词","grammar":["先暂时括起who引导的修饰部分。","情态动词should后用动词原形ask。"],"examTip":"阅读时先抓Students should ask，再补充是哪一类学生。"},"trans":[{"source":"语言中心位于图书馆附近。","answer":"The language center is located near the library.","keywords":["language center","is located","near","library"],"grammar":"be located near表示“位于……附近”，主语为单数时用is。","acceptedAnswers":["The language center is located near the library.","The language center is near the library."],"level":"基础衔接表达","topic":"校园方位","chunks":["the language center","be located near","the library"],"alternative":"The language center is near the library."},{"source":"如果你需要帮助，可以去信息台。","answer":"If you need help, you can go to the information desk.","keywords":["if","need help","can go","information desk"],"grammar":"if引导条件从句；主句用can加动词原形。","acceptedAnswers":["If you need help, you can go to the information desk.","You can visit the information desk if you need help."],"level":"基础衔接表达","topic":"条件与建议","chunks":["if you need help","can go to","the information desk"],"alternative":"You can visit the information desk if you need help."}]},"2026-09-12":{"title":"时间管理与任务优先级","grammarTip":"表达计划时注意动词形式：plan to do、finish doing、must do。时间从句里先找连接词，再判断主句动作。","words":[{"word":"schedule","phonetic":"/ˈskedʒuːl/","meaning":"日程；安排","phrase":"make a schedule","example":"I make a schedule every Sunday evening.","exampleZh":"我每周日晚上制定日程。"},{"word":"organize","phonetic":"/ˈɔːrɡənaɪz/","meaning":"组织；整理","phrase":"organize tasks","example":"She organizes her tasks by importance.","exampleZh":"她按重要程度安排任务。"},{"word":"task","phonetic":"/tæsk/","meaning":"任务","phrase":"complete a task","example":"This task will take about twenty minutes.","exampleZh":"这项任务大约需要二十分钟。"},{"word":"deadline","phonetic":"/ˈdedlaɪn/","meaning":"截止日期","phrase":"meet a deadline","example":"The deadline for the report is Friday.","exampleZh":"报告的截止日期是周五。"},{"word":"complete","phonetic":"/kəmˈpliːt/","meaning":"完成；完整的","phrase":"complete the work","example":"He completed the work before dinner.","exampleZh":"他在晚饭前完成了工作。"},{"word":"priority","phonetic":"/praɪˈɔːrəti/","meaning":"优先事项","phrase":"top priority","example":"Reviewing today's mistakes is my top priority.","exampleZh":"复习今天的错题是我的首要任务。"},{"word":"break","phonetic":"/breɪk/","meaning":"休息；打破","phrase":"take a break","example":"Take a short break after forty minutes.","exampleZh":"四十分钟后短暂休息一下。"},{"word":"efficient","phonetic":"/ɪˈfɪʃənt/","meaning":"高效的","phrase":"an efficient method","example":"A clear list makes study more efficient.","exampleZh":"清晰的清单让学习更高效。"}],"grammar":[{"prompt":"Mina plans ___ the report before Friday.","promptZh":"米娜计划在周五前完成报告。","options":["finish","to finish","finishing","finished"],"optionsZh":["原形","不定式","动名词","过去式"],"answer":1,"explanation":"plan to do something表示计划做某事。","tag":"verb-form"},{"prompt":"You must ___ the most important task first.","promptZh":"你必须先完成最重要的任务。","options":["completed","completes","complete","completing"],"optionsZh":["过去式","第三人称单数","动词原形","现在分词"],"answer":2,"explanation":"must后接动词原形complete。","tag":"modal"},{"prompt":"After Leo ___ his homework, he takes a short break.","promptZh":"利奥完成作业后会短暂休息。","options":["finish","finishes","finishing","finished"],"optionsZh":["原形","第三人称单数","现在分词","过去式"],"answer":1,"explanation":"描述习惯，时间从句主语Leo为第三人称单数，用finishes。","tag":"present"},{"prompt":"The deadline is close, ___ we need to organize our time.","promptZh":"截止日期临近，所以我们需要安排好时间。","options":["but","so","although","unless"],"optionsZh":["但是","所以","尽管","除非"],"answer":1,"explanation":"前因后果，用so连接。","tag":"connector"},{"prompt":"Which is the main verb in “The list that shows my priorities helps me focus” ?","promptZh":"在“The list that shows my priorities helps me focus”中，主句谓语是什么？","options":["shows","priorities","helps","focus"],"optionsZh":["显示（从句谓语）","优先事项","帮助（主句谓语）","集中"],"answer":2,"explanation":"that shows my priorities修饰list；主干The list helps me focus。","tag":"main-verb"},{"prompt":"A short break can make your study more ___.","promptZh":"短暂休息可以让学习更高效。","options":["efficiency","efficient","efficiently","efficiencies"],"optionsZh":["效率（名词）","高效的（形容词）","高效地（副词）","效率（复数）"],"answer":1,"explanation":"make加宾语后用形容词作宾补，选efficient。","tag":"word-form"}],"reading":{"title":"A Realistic Weekly Schedule","titleZh":"一份现实的每周计划","level":"基础衔接 · 原创模拟","topic":"学习策略与时间管理","passage":"Kai used to write a long list of tasks every morning. The list looked impressive, but he rarely finished it. He often put easy jobs first and left important work until late at night. This week, he tried a different method. On Sunday evening, he checked all his deadlines and chose three priorities for each day. He also estimated how much time each task would need. Instead of planning three hours without a pause, he divided the time into shorter periods and added small breaks. When an unexpected meeting took thirty minutes, he moved one low-priority task to another day rather than giving up the whole schedule. By Friday, Kai had not completed everything, but he had finished every urgent task. He learned that a useful schedule should guide decisions, not make a student feel guilty whenever a plan changes.","passageZh":"凯以前每天早上都会写很长的任务清单。清单看起来很厉害，但他很少完成。他常先做容易的事，把重要任务拖到深夜。本周他换了一种方法：周日晚查看所有截止日期，每天选三项优先任务，并估计每项所需时间。他不再连续安排三小时，而是分成较短时段，加入小休息。一次临时会议占了三十分钟后，他把一项低优先级任务移到另一天，而不是放弃整份计划。到周五，他虽然没有完成一切，却完成了所有紧急任务。他明白，有用的计划应帮助做决定，而不是在计划变化时让人内疚。","questions":[{"prompt":"What problem did Kai have with his old lists?","promptZh":"凯以前的清单有什么问题？","options":["They were too short","He rarely finished them","They included no easy work","He lost them every day"],"optionsZh":["太短","很少完成","没有容易任务","每天都丢失"],"answer":1,"explanation":"第一段说明长清单看起来不错，但他很少完成。","tag":"reading"},{"prompt":"What did Kai do on Sunday evening?","promptZh":"凯周日晚做了什么？","options":["He checked deadlines and set priorities","He finished every weekly task","He cancelled all meetings","He studied for three hours without rest"],"optionsZh":["查看截止日期并设定优先项","完成一周全部任务","取消所有会议","不休息学习三小时"],"answer":0,"explanation":"定位On Sunday evening后的两项行动。","tag":"reading"},{"prompt":"How did he respond to the unexpected meeting?","promptZh":"他怎样应对临时会议？","options":["He gave up the schedule","He worked all night","He moved a less important task","He missed the meeting"],"optionsZh":["放弃计划","通宵工作","移动较不重要的任务","错过会议"],"answer":2,"explanation":"他把一项low-priority task移到另一天。","tag":"reading"},{"prompt":"What is the main idea of the passage?","promptZh":"文章主旨是什么？","options":["A schedule must never change","Long lists always improve grades","Realistic plans support better decisions","Students should avoid all breaks"],"optionsZh":["日程绝不能改变","长清单总能提高成绩","现实计划帮助做出更好决定","学生应避免休息"],"answer":2,"explanation":"结尾总结：计划是决策工具，应允许合理调整。","tag":"reading"}]},"listening":{"title":"Planning a Group Report","titleZh":"安排小组报告","level":"基础衔接短听力 · 合成朗读","tip":"记录任务、负责人和截止时间；听到but时注意计划发生的变化。","passage":"Our group report is due next Monday. I can collect the information tonight, and Maya will organize the notes tomorrow. Ben planned to make the slides on Saturday, but he has a sports event then, so he will finish them on Sunday morning. Let us check everything together at four on Sunday afternoon and leave time for one final change.","passageZh":"我们的小组报告下周一到期。我今晚收集资料，玛雅明天整理笔记。本来本计划周六做幻灯片，但他那时有体育活动，所以改为周日上午完成。周日下午四点我们一起检查，并留出一次最终修改的时间。","dictation":["Our group report is due next Monday.","Let us check everything together on Sunday afternoon."],"dictationZh":["我们的小组报告下周一到期。","我们周日下午一起检查所有内容吧。"],"questions":[{"prompt":"When will Ben make the slides?","promptZh":"本什么时候制作幻灯片？","options":["Saturday morning","Sunday morning","Sunday afternoon","Next Monday"],"optionsZh":["周六上午","周日上午","周日下午","下周一"],"answer":1,"explanation":"but和so之后给出新安排Sunday morning。","tag":"listeningChoice"},{"prompt":"Why will the group meet on Sunday afternoon?","promptZh":"小组为何周日下午见面？","options":["To choose a new topic","To collect information","To check the whole report","To attend a sports event"],"optionsZh":["选新主题","收集信息","检查整份报告","参加体育活动"],"answer":2,"explanation":"末句明确说check everything together。","tag":"listeningChoice"}]},"sent":{"text":"A schedule that includes short breaks often helps students work more efficiently.","main":"A schedule often helps students work more efficiently.","translation":"包含短暂休息的日程通常能帮助学生更高效地学习。","core":["schedule","helps","students","work"],"keywords":["日程","休息","学生","高效"],"structure":"that includes short breaks修饰schedule；主句谓语helps，work是宾补结构中的动词原形。","mainZh":"日程通常帮助学生更高效地学习。","level":"基础衔接句法","topic":"定语从句与help结构","grammar":["先找主句A schedule helps students。","help somebody do something中do可用动词原形。"],"examTip":"遇到两个动词时，先判断一个是否在定语从句内。"},"trans":[{"source":"我计划在截止日期前完成这项任务。","answer":"I plan to complete this task before the deadline.","keywords":["plan to","complete","task","before the deadline"],"grammar":"plan后接to do；before the deadline作时间状语。","acceptedAnswers":["I plan to complete this task before the deadline.","I plan to finish the task before the deadline."],"level":"基础衔接表达","topic":"计划与截止日期","chunks":["plan to complete","this task","before the deadline"],"alternative":"I plan to finish the task before the deadline."},{"source":"短暂休息可以让学习更高效。","answer":"A short break can make studying more efficient.","keywords":["short break","can make","studying","more efficient"],"grammar":"can后用make原形；make加宾语和形容词宾补。","acceptedAnswers":["A short break can make studying more efficient.","Taking a short break can make study more efficient."],"level":"基础衔接表达","topic":"学习效率","chunks":["a short break","make studying","more efficient"],"alternative":"Taking a short break can make study more efficient."}]},"2026-09-13":{"title":"图书馆检索与可靠信息","grammarTip":"区分information（不可数）与source（可数）；用because说明原因，用which/that连接物的定语从句。","words":[{"word":"resource","phonetic":"/ˈriːsɔːrs/","meaning":"资源；资料","phrase":"learning resource","example":"The website offers free learning resources.","exampleZh":"这个网站提供免费学习资源。"},{"word":"borrow","phonetic":"/ˈbɑːroʊ/","meaning":"借入","phrase":"borrow a book from","example":"You may borrow this book for two weeks.","exampleZh":"你可以借这本书两周。"},{"word":"return","phonetic":"/rɪˈtɜːrn/","meaning":"归还；返回","phrase":"return a book","example":"Please return the book on time.","exampleZh":"请按时归还图书。"},{"word":"search","phonetic":"/sɜːrtʃ/","meaning":"搜索；搜查","phrase":"search for information","example":"We searched for information in the library database.","exampleZh":"我们在图书馆数据库中搜索资料。"},{"word":"source","phonetic":"/sɔːrs/","meaning":"来源；出处","phrase":"a reliable source","example":"Always record the source of an important fact.","exampleZh":"务必记录重要事实的出处。"},{"word":"reliable","phonetic":"/rɪˈlaɪəbəl/","meaning":"可靠的","phrase":"reliable information","example":"The librarian helped us find a reliable article.","exampleZh":"图书管理员帮助我们找到了一篇可靠的文章。"},{"word":"information","phonetic":"/ˌɪnfərˈmeɪʃən/","meaning":"信息；资料","phrase":"useful information","example":"This page contains useful information.","exampleZh":"这个页面包含有用的信息。"},{"word":"note","phonetic":"/noʊt/","meaning":"笔记；注意到","phrase":"take notes","example":"I take notes in my own words.","exampleZh":"我用自己的话记笔记。"}],"grammar":[{"prompt":"The article gives us useful ___.","promptZh":"这篇文章给了我们有用的信息。","options":["informations","information","an information","inform"],"optionsZh":["错误复数","信息（不可数）","错误冠词搭配","通知（动词）"],"answer":1,"explanation":"information是不可数名词，不能加-s，也不能直接用an。","tag":"uncountable"},{"prompt":"The website ___ we used belongs to the university.","promptZh":"我们使用的网站属于这所大学。","options":["who","that","when","whose"],"optionsZh":["指人","指物的定语从句关系词","何时","谁的"],"answer":1,"explanation":"先行词website指物，that在从句中作宾语。","tag":"relative-clause"},{"prompt":"Nora borrowed a book ___ the university library.","promptZh":"诺拉从大学图书馆借了一本书。","options":["from","with","during","among"],"optionsZh":["从","和；用","在……期间","在……之中"],"answer":0,"explanation":"borrow something from somewhere是固定搭配。","tag":"preposition"},{"prompt":"We checked the writer's name ___ we wanted a reliable source.","promptZh":"我们核对了作者姓名，因为想要可靠来源。","options":["but","because","or","unless"],"optionsZh":["但是","因为","或者","除非"],"answer":1,"explanation":"后半句说明核对作者的原因，用because。","tag":"connector"},{"prompt":"Please ___ the book before the end of the month.","promptZh":"请在月底前归还这本书。","options":["returns","return","returned","returning"],"optionsZh":["第三人称单数","动词原形","过去式","现在分词"],"answer":1,"explanation":"祈使句以动词原形开头。","tag":"verb-form"},{"prompt":"Which is the main verb in “The notes that Ella wrote contain three useful sources” ?","promptZh":"在“The notes that Ella wrote contain three useful sources”中，主句谓语是什么？","options":["wrote","contain","sources","useful"],"optionsZh":["写（从句谓语）","包含（主句谓语）","来源","有用的"],"answer":1,"explanation":"that Ella wrote修饰notes；主句是The notes contain...。","tag":"main-verb"}],"reading":{"title":"More Than the First Search Result","titleZh":"不只看第一条搜索结果","level":"基础衔接 · 原创模拟","topic":"信息素养与学习研究","passage":"For a class project, Olivia needed information about how city trees reduce summer heat. Her first online search produced thousands of results. She almost copied a statement from the first page, but the page did not name its writer or explain where the numbers came from. Olivia then used the university library database. She found a recent article written by environmental researchers and checked its list of sources. The article was harder to read, so she first studied the title, headings, and charts. She wrote the main idea in simple words and saved the full source information beside her note. Later, she compared the article with a report from the city government. The two sources used different examples but reached a similar conclusion. Olivia did not become an expert in one afternoon, yet she learned an important habit: useful research depends on checking who produced information and what evidence supports it.","passageZh":"课堂项目要求奥利维娅查找城市树木如何降低夏季高温的信息。第一次网上搜索出现成千上万条结果。她差点抄下第一页的一句话，但页面没有作者，也没说明数字来源。随后她使用大学图书馆数据库，找到环境研究人员近期撰写的文章，并检查其参考来源。文章较难，她先看标题、小标题和图表，用简单的话记录主旨，并把完整出处记在笔记旁。后来她又与市政府报告比较；两份资料例子不同，却得出相似结论。她没有一下午就成为专家，但学到重要习惯：有效研究要核对信息由谁产生、有什么证据支持。","questions":[{"prompt":"Why did Olivia avoid using the first webpage?","promptZh":"奥利维娅为什么没有使用第一个网页？","options":["It was too recent","It had no named writer or source for its numbers","It contained no words","It was written by the city government"],"optionsZh":["太新","没有署名作者或数字出处","没有文字","由市政府撰写"],"answer":1,"explanation":"原文指出该页面既不署名，也没解释数字来源。","tag":"reading"},{"prompt":"How did she begin reading the difficult article?","promptZh":"她怎样开始阅读那篇较难的文章？","options":["By translating every word","By reading titles, headings, and charts","By copying the conclusion","By asking a friend to finish it"],"optionsZh":["逐词翻译","先看标题、小标题和图表","抄结论","让朋友完成"],"answer":1,"explanation":"这是她降低阅读难度的具体策略。","tag":"reading"},{"prompt":"What did the two reliable sources share?","promptZh":"两份可靠资料有什么共同点？","options":["The same writer","Exactly the same examples","A similar conclusion","No supporting evidence"],"optionsZh":["同一作者","完全相同的例子","相似结论","没有证据"],"answer":2,"explanation":"两者例子不同，但结论相似。","tag":"reading"},{"prompt":"What habit does the passage recommend?","promptZh":"文章建议养成什么习惯？","options":["Trust the first result","Check the producer and evidence","Avoid library databases","Use only very short texts"],"optionsZh":["相信第一条结果","核对信息生产者和证据","避免数据库","只用短文"],"answer":1,"explanation":"结尾句直接概括研究习惯。","tag":"reading"}]},"listening":{"title":"Asking a Librarian","titleZh":"向图书管理员咨询","level":"基础衔接短听力 · 合成朗读","tip":"听清需求、检索地点和借阅期限；先记关键词，不必逐词翻译。","passage":"I am looking for reliable information about public transport, but I do not know which database to use. Start with the social science database on the library website. Search for articles published in the last five years, and write down each source. You can borrow the transport report on this desk, but please return it by next Wednesday.","passageZh":"我在找公共交通方面的可靠资料，但不知道用哪个数据库。请先使用图书馆网站上的社会科学数据库，搜索过去五年发表的文章并记下每个出处。桌上这份交通报告可以借走，但请在下周三前归还。","dictation":["Search for articles published in the last five years.","Please return the report by next Wednesday."],"dictationZh":["搜索过去五年发表的文章。","请在下周三前归还报告。"],"questions":[{"prompt":"Which database should the student use first?","promptZh":"学生应该先用哪个数据库？","options":["The medical database","The social science database","A shopping website","A school map"],"optionsZh":["医学数据库","社会科学数据库","购物网站","校园地图"],"answer":1,"explanation":"建议从social science database开始。","tag":"listeningChoice"},{"prompt":"What must the student do by next Wednesday?","promptZh":"学生必须在下周三前做什么？","options":["Publish an article","Return the report","Build a database","Visit the city office"],"optionsZh":["发表文章","归还报告","建立数据库","参观市政办公室"],"answer":1,"explanation":"结尾明确给出归还期限。","tag":"listeningChoice"}]},"sent":{"text":"The article that Olivia found provides reliable information about city trees.","main":"The article provides reliable information about city trees.","translation":"奥利维娅找到的文章提供了关于城市树木的可靠信息。","core":["article","provides","reliable","information"],"keywords":["文章","找到","可靠信息","城市树木"],"structure":"that Olivia found是定语从句，修饰article；主句谓语provides与单数主语一致。","mainZh":"这篇文章提供关于城市树木的可靠信息。","level":"基础衔接句法","topic":"定语从句与不可数名词","grammar":["先括起that Olivia found。","information不可数，不能写informations。"],"examTip":"定位主干后再把“谁找到的”补回译文。"},"trans":[{"source":"我们需要从可靠来源寻找信息。","answer":"We need to search for information from reliable sources.","keywords":["need to","search for","information","reliable sources"],"grammar":"need to do；search for表示寻找；information不可数。","acceptedAnswers":["We need to search for information from reliable sources.","We need to find information from reliable sources."],"level":"基础衔接表达","topic":"信息检索","chunks":["need to search for","information","from reliable sources"],"alternative":"We need to find information from reliable sources."},{"source":"请按时归还你从图书馆借的书。","answer":"Please return the book that you borrowed from the library on time.","keywords":["return","book","borrowed from","library","on time"],"grammar":"that引导定语从句；borrow something from somewhere。","acceptedAnswers":["Please return the book that you borrowed from the library on time.","Please return the library book on time."],"level":"基础衔接表达","topic":"图书借阅","chunks":["return the book","borrowed from the library","on time"],"alternative":"Please return the library book on time."}]},"2026-09-14":{"title":"睡眠习惯与学习状态","grammarTip":"比较一般现在时与过去时，并用although表达让步。benefit既可作名词也可作动词，concentrate常与on搭配。","words":[{"word":"regular","phonetic":"/ˈreɡjələr/","meaning":"规律的；定期的","phrase":"a regular schedule","example":"A regular sleep schedule helps me wake up easily.","exampleZh":"规律的睡眠安排让我更容易醒来。"},{"word":"balance","phonetic":"/ˈbæləns/","meaning":"平衡；使平衡","phrase":"keep a balance","example":"Students need to balance study and rest.","exampleZh":"学生需要平衡学习与休息。"},{"word":"reduce","phonetic":"/rɪˈduːs/","meaning":"减少","phrase":"reduce stress","example":"A short walk can reduce stress.","exampleZh":"短暂散步可以减轻压力。"},{"word":"stress","phonetic":"/stres/","meaning":"压力；强调","phrase":"deal with stress","example":"Too much stress makes it hard to sleep.","exampleZh":"压力过大会让人难以入睡。"},{"word":"concentrate","phonetic":"/ˈkɑːnsəntreɪt/","meaning":"集中注意力","phrase":"concentrate on","example":"I can concentrate on reading after a good night's sleep.","exampleZh":"睡好一晚后，我能专心阅读。"},{"word":"benefit","phonetic":"/ˈbenəfɪt/","meaning":"益处；使受益","phrase":"benefit from","example":"Both memory and mood benefit from enough sleep.","exampleZh":"充足睡眠有益于记忆和情绪。"},{"word":"routine","phonetic":"/ruːˈtiːn/","meaning":"惯例；日常习惯","phrase":"daily routine","example":"Turning off my phone is part of my evening routine.","exampleZh":"关手机是我晚间习惯的一部分。"},{"word":"quality","phonetic":"/ˈkwɑːləti/","meaning":"质量；品质","phrase":"sleep quality","example":"Late coffee may affect sleep quality.","exampleZh":"太晚喝咖啡可能影响睡眠质量。"}],"grammar":[{"prompt":"Enough sleep helps students ___ on their work.","promptZh":"充足睡眠帮助学生专注学习。","options":["concentrates","concentrated","concentrate","concentrating"],"optionsZh":["第三人称单数","过去式","动词原形","现在分词"],"answer":2,"explanation":"help somebody do something，使用动词原形concentrate。","tag":"verb-form"},{"prompt":"Leo ___ tired yesterday because he slept only five hours.","promptZh":"利奥昨天很累，因为只睡了五小时。","options":["is","was","were","be"],"optionsZh":["现在时单数","过去时单数","过去时复数","原形"],"answer":1,"explanation":"yesterday提示过去时，主语Leo用was。","tag":"past"},{"prompt":"Although the exam is important, you still ___ rest.","promptZh":"虽然考试很重要，你仍然需要休息。","options":["needs","need","needed to","needing"],"optionsZh":["第三人称单数","原形/现在时","过去时短语","现在分词"],"answer":1,"explanation":"主语you的一般现在时谓语用need。","tag":"present"},{"prompt":"A regular routine can reduce ___.","promptZh":"规律作息可以减轻压力。","options":["stress","stressed","stressful","stressing"],"optionsZh":["压力（名词）","感到压力的","有压力的","使有压力"],"answer":0,"explanation":"reduce后需要名词作宾语，选stress。","tag":"word-form"},{"prompt":"Mia benefits ___ going to bed at the same time each night.","promptZh":"米娅受益于每晚同一时间睡觉。","options":["at","from","for","by"],"optionsZh":["在","从……受益","为了","通过"],"answer":1,"explanation":"benefit from是固定搭配。","tag":"preposition"},{"prompt":"Which is the main verb in “People who keep a regular routine often feel calmer” ?","promptZh":"在“保持规律作息的人通常感觉更平静”中，主句谓语是什么？","options":["keep","routine","feel","calmer"],"optionsZh":["保持（从句谓语）","习惯","感觉（主句谓语）","更平静"],"answer":2,"explanation":"who keep...修饰People；主干People feel calmer。","tag":"main-verb"}],"reading":{"title":"Changing One Evening Habit","titleZh":"改变一个晚间习惯","level":"基础衔接 · 原创模拟","topic":"健康与学习效率","passage":"During the first week of term, Chen often studied until one in the morning. He believed that more time at his desk would always produce better results. However, he became sleepy in class and read the same paragraphs again and again. Instead of making a perfect health plan, Chen changed one evening habit. He set an alarm for eleven, stopped schoolwork, and prepared his bag for the next day. He also put his phone across the room so that messages would not keep him awake. For several nights, falling asleep earlier felt difficult. By the end of the second week, however, he usually woke before his morning alarm and could concentrate longer in class. Chen still studies hard, especially before a test, but he no longer treats sleep as wasted time. He now sees good sleep as part of an effective study routine.","passageZh":"开学第一周，陈常学习到凌晨一点。他以为坐在书桌前越久，结果就一定越好。然而，他上课犯困，同一段要读很多遍。他没有制定完美的健康计划，而只改变一个晚间习惯：十一点设闹钟，停止学习，整理第二天的书包，并把手机放到房间另一边，避免消息让自己保持清醒。前几晚早睡仍很难，但第二周结束时，他常能在早晨闹钟前醒来，上课专注更久。他仍努力学习，尤其考前，但不再把睡眠当作浪费时间，而把良好睡眠视为高效学习习惯的一部分。","questions":[{"prompt":"What did Chen once believe?","promptZh":"陈过去相信什么？","options":["More desk time always meant better results","Morning classes were unnecessary","Phones improved sleep quality","Health plans had to be perfect"],"optionsZh":["坐书桌前越久结果越好","早课没必要","手机改善睡眠","健康计划必须完美"],"answer":0,"explanation":"第二句给出他原来的错误想法。","tag":"reading"},{"prompt":"What single habit did Chen introduce?","promptZh":"陈引入了什么具体习惯？","options":["Exercising at midnight","Ending schoolwork at eleven","Skipping morning class","Drinking more coffee"],"optionsZh":["午夜锻炼","十一点停止学习","不去早课","喝更多咖啡"],"answer":1,"explanation":"他设置十一点闹钟并停止学习。","tag":"reading"},{"prompt":"What change appeared by the end of the second week?","promptZh":"第二周结束时出现了什么变化？","options":["He needed no study","He woke earlier and focused longer","He received fewer messages","He stopped preparing for tests"],"optionsZh":["不再需要学习","醒得更早且专注更久","消息更少","不再备考"],"answer":1,"explanation":"原文同时提到早醒和课堂专注延长。","tag":"reading"},{"prompt":"How does Chen now view sleep?","promptZh":"陈现在怎样看睡眠？","options":["As wasted time","As a reward only","As part of effective study","As a cause of every problem"],"optionsZh":["浪费时间","只是一种奖励","高效学习的一部分","所有问题的原因"],"answer":2,"explanation":"末句直接概括新认识。","tag":"reading"}]},"listening":{"title":"Advice Before an Early Exam","titleZh":"早场考试前的建议","level":"基础衔接短听力 · 合成朗读","tip":"注意建议动作与原因；听到instead of时分清“不要做”和“应该做”。","passage":"Tomorrow's exam begins at eight, so try to arrive by seven forty-five. Prepare your pencils and student card tonight instead of searching for them in the morning. Do not stay up late to learn every detail. Review your short notes, turn off your phone, and get enough sleep. A clear mind will help you read the questions carefully.","passageZh":"明天考试八点开始，请尽量在七点四十五前到达。今晚准备好铅笔和学生证，不要早晨再找。不要熬夜学每个细节；复习简短笔记、关手机并保证充足睡眠。清醒的头脑会帮助你仔细读题。","dictation":["Prepare your pencils and student card tonight.","A clear mind will help you read the questions carefully."],"dictationZh":["今晚准备好铅笔和学生证。","清醒的头脑会帮助你仔细阅读题目。"],"questions":[{"prompt":"When should students arrive?","promptZh":"学生应该何时到达？","options":["At seven forty-five","At eight fifteen","At nine","Tonight"],"optionsZh":["七点四十五","八点十五","九点","今晚"],"answer":0,"explanation":"考试八点，建议七点四十五前到。","tag":"listeningChoice"},{"prompt":"What does the speaker advise against?","promptZh":"说话者不建议做什么？","options":["Preparing a student card","Reading questions carefully","Staying up late","Reviewing short notes"],"optionsZh":["准备学生证","仔细读题","熬夜","复习短笔记"],"answer":2,"explanation":"Do not stay up late是明确的否定建议。","tag":"listeningChoice"}]},"sent":{"text":"Students who get enough sleep can concentrate better during morning classes.","main":"Students can concentrate better during morning classes.","translation":"睡眠充足的学生在早课上能更好地集中注意力。","core":["students","can","concentrate","better"],"keywords":["学生","充足睡眠","集中注意力","早课"],"structure":"who get enough sleep修饰Students；主句谓语can concentrate。","mainZh":"学生在早课上能更好地集中注意力。","level":"基础衔接句法","topic":"定语从句与情态动词","grammar":["who从句说明哪类学生。","can后接concentrate原形，concentrate on后可接具体对象。"],"examTip":"长句先读主干，再补充睡眠条件。"},"trans":[{"source":"规律的作息可以帮助我们减轻压力。","answer":"A regular routine can help us reduce stress.","keywords":["regular routine","can help","reduce stress"],"grammar":"can help somebody do；stress作不可数名词。","acceptedAnswers":["A regular routine can help us reduce stress.","A regular schedule can help us reduce stress."],"level":"基础衔接表达","topic":"健康习惯","chunks":["a regular routine","help us reduce","stress"],"alternative":"A regular schedule can help us reduce stress."},{"source":"虽然考试很重要，但充足的睡眠也有益。","answer":"Although the exam is important, enough sleep is also beneficial.","keywords":["although","exam","is important","enough sleep","beneficial"],"grammar":"although引导让步从句；beneficial是形容词，前面用is。","acceptedAnswers":["Although the exam is important, enough sleep is also beneficial.","Although the exam is important, enough sleep also has benefits."],"level":"基础衔接表达","topic":"让步关系","chunks":["although the exam is important","enough sleep","is also beneficial"],"alternative":"Although the exam is important, enough sleep also has benefits."}]},"2026-09-15":{"title":"在线学习与注意力管理","grammarTip":"辨认被动语态be + past participle，并区分动词、形容词和名词。表达目的可用so that，表达同时发生可用while。","words":[{"word":"online","phonetic":"/ˌɑːnˈlaɪn/","meaning":"在线的；在线地","phrase":"online course","example":"Our online course includes short videos and quizzes.","exampleZh":"我们的在线课程包含短视频和测验。"},{"word":"platform","phonetic":"/ˈplætfɔːrm/","meaning":"平台","phrase":"learning platform","example":"The teacher posts materials on the learning platform.","exampleZh":"老师把资料发布在学习平台上。"},{"word":"upload","phonetic":"/ˌʌpˈloʊd/","meaning":"上传","phrase":"upload a file","example":"Please upload your work before six.","exampleZh":"请在六点前上传作业。"},{"word":"download","phonetic":"/ˌdaʊnˈloʊd/","meaning":"下载","phrase":"download the document","example":"I downloaded the document for offline reading.","exampleZh":"我下载了文件以便离线阅读。"},{"word":"device","phonetic":"/dɪˈvaɪs/","meaning":"设备","phrase":"digital device","example":"Keep only one device open during the lesson.","exampleZh":"上课期间只打开一台设备。"},{"word":"connect","phonetic":"/kəˈnekt/","meaning":"连接；联系","phrase":"connect to the Internet","example":"My laptop cannot connect to the campus network.","exampleZh":"我的笔记本电脑无法连接校园网络。"},{"word":"distract","phonetic":"/dɪˈstrækt/","meaning":"使分心","phrase":"distract someone from","example":"Pop-up messages distract me from reading.","exampleZh":"弹出消息让我无法专心阅读。"},{"word":"focus","phonetic":"/ˈfoʊkəs/","meaning":"集中；焦点","phrase":"focus on","example":"I focus on one lesson at a time.","exampleZh":"我一次专注一节课。"}],"grammar":[{"prompt":"The homework must be ___ before six.","promptZh":"作业必须在六点前上传。","options":["upload","uploads","uploaded","uploading"],"optionsZh":["原形","第三人称单数","过去分词","现在分词"],"answer":2,"explanation":"must be加过去分词构成被动语态，选uploaded。","tag":"passive"},{"prompt":"I downloaded the article ___ I could read it on the train.","promptZh":"我下载文章，以便在火车上阅读。","options":["so that","but","unless","although"],"optionsZh":["以便","但是","除非","虽然"],"answer":0,"explanation":"后半句说明目的，用so that。","tag":"connector"},{"prompt":"Messages often distract students ___ their work.","promptZh":"消息常使学生无法专心工作。","options":["to","from","at","into"],"optionsZh":["向","使离开","在","进入"],"answer":1,"explanation":"distract somebody from something是固定搭配。","tag":"preposition"},{"prompt":"While the video ___, Nina took notes.","promptZh":"视频播放时，妮娜做了笔记。","options":["played","was playing","plays","has played"],"optionsZh":["一般过去时","过去进行时","一般现在时","现在完成时"],"answer":1,"explanation":"表示过去某段时间正在进行的背景动作，用was playing。","tag":"past-continuous"},{"prompt":"This platform is easy to ___.","promptZh":"这个平台很容易使用。","options":["use","useful","used","using"],"optionsZh":["使用（动词）","有用的","过去分词","现在分词"],"answer":0,"explanation":"be easy to do结构中to后接动词原形use。","tag":"verb-form"},{"prompt":"Which is the main verb in “The notifications that appear on my screen break my attention” ?","promptZh":"在“屏幕上出现的通知打断我的注意力”中，主句谓语是什么？","options":["appear","screen","break","attention"],"optionsZh":["出现（从句谓语）","屏幕","打断（主句谓语）","注意力"],"answer":2,"explanation":"that appear...修饰notifications；主句谓语break。","tag":"main-verb"}],"reading":{"title":"Using an Online Course Actively","titleZh":"主动使用在线课程","level":"基础衔接 · 原创模拟","topic":"数字学习与自我管理","passage":"When Hana first joined an online course, she watched every video from beginning to end but remembered little. She usually kept several message windows open and sometimes answered friends while the teacher was explaining a key idea. Later, Hana changed how she used the platform. Before each lesson, she downloaded the worksheet and wrote two questions about the topic. During the video, she paused after each short section and answered one question without looking at her notes. She also placed her phone behind her laptop and turned off computer notifications for thirty minutes. If an explanation remained unclear, she marked the exact time instead of replaying the entire video. At the end, she wrote a three-sentence summary and uploaded it with her worksheet. The course did not become easier overnight, but Hana became a more active learner. Technology helped most when she used it to practise, not simply to keep information playing on a screen.","passageZh":"哈娜刚参加在线课程时，会从头到尾看完每个视频，却记不住多少。她常开着几个消息窗口，有时老师讲关键点时还在回复朋友。后来她改变了平台使用方式：课前下载练习单，写两个与主题有关的问题；看视频时，每个短节后暂停，不看笔记回答一个问题。她把手机放在电脑后，并关闭电脑通知三十分钟。某处不清楚时，她标记准确时间，而不是重放整段。最后写三句话总结，与练习单一起上传。课程没有一夜变容易，但她成了更主动的学习者。技术最有帮助的时候，是用来练习，而不只是让信息在屏幕上播放。","questions":[{"prompt":"Why did Hana remember little at first?","promptZh":"哈娜最初为什么记得很少？","options":["The videos had no sound","She watched passively and answered messages","She never opened the platform","The teacher used no examples"],"optionsZh":["视频没声音","她被动观看并回复消息","从未打开平台","老师不用例子"],"answer":1,"explanation":"开头描述她只是播放视频，同时被消息分散。","tag":"reading"},{"prompt":"What did Hana do before each lesson?","promptZh":"哈娜每节课前做什么？","options":["Uploaded a final exam","Downloaded the worksheet and wrote questions","Called every friend","Replayed the whole course"],"optionsZh":["上传期末考试","下载练习单并写问题","给每个朋友打电话","重放整个课程"],"answer":1,"explanation":"定位Before each lesson后的动作。","tag":"reading"},{"prompt":"How did she handle an unclear explanation?","promptZh":"她怎样处理不清楚的讲解？","options":["Ignored it","Marked its exact time","Deleted the video","Watched every video again"],"optionsZh":["忽略","标记准确时间","删除视频","重看所有视频"],"answer":1,"explanation":"她标记具体时间，避免整段重放。","tag":"reading"},{"prompt":"What is the writer's main point?","promptZh":"作者的主要观点是什么？","options":["Online courses require no effort","Technology works best with active practice","Notifications improve memory","Long videos are always better"],"optionsZh":["在线课不需努力","技术结合主动练习效果最好","通知改善记忆","长视频总是更好"],"answer":1,"explanation":"末句以practice和simply playing information作对比。","tag":"reading"}]},"listening":{"title":"Submitting an Online Assignment","titleZh":"提交在线作业","level":"基础衔接短听力 · 合成朗读","tip":"抓截止时间、文件格式和故障处理方法；数字与文件名是常见细节考点。","passage":"Please upload your reading summary to the class platform by six o'clock tomorrow evening. Use a PDF file and put your student number in the file name. After uploading, open the file once to check that it works. If the platform cannot connect, send the file to the course email before the deadline and try the platform again later.","passageZh":"请在明晚六点前把阅读总结上传到班级平台。使用PDF文件，并把学号写进文件名。上传后打开一次，检查文件能否使用。如果平台无法连接，请在截止时间前把文件发到课程邮箱，稍后再试平台。","dictation":["Put your student number in the file name.","Open the file once to check that it works."],"dictationZh":["把你的学号写进文件名。","打开一次文件，检查它能否使用。"],"questions":[{"prompt":"What file type should students upload?","promptZh":"学生应该上传什么格式的文件？","options":["An audio file","A PDF file","A video file","A paper map"],"optionsZh":["音频文件","PDF文件","视频文件","纸质地图"],"answer":1,"explanation":"指令明确要求Use a PDF file。","tag":"listeningChoice"},{"prompt":"What should a student do if the platform fails?","promptZh":"平台无法使用时学生应该怎么做？","options":["Wait past the deadline","Send the file by course email","Delete the summary","Change the student number"],"optionsZh":["等到截止后","发到课程邮箱","删除总结","更改学号"],"answer":1,"explanation":"备用提交方式是course email，且要在截止前。","tag":"listeningChoice"}]},"sent":{"text":"Students who turn off notifications often focus more fully on online lessons.","main":"Students often focus more fully on online lessons.","translation":"关闭通知的学生往往能更充分地专注在线课程。","core":["students","focus","online","lessons"],"keywords":["学生","关闭通知","专注","在线课程"],"structure":"who turn off notifications修饰Students；主句谓语focus，on online lessons是介词短语。","mainZh":"学生往往更充分地专注在线课程。","level":"基础衔接句法","topic":"定语从句与动词搭配","grammar":["turn是从句谓语，focus是主句谓语。","focus on是固定搭配。"],"examTip":"不要因为看到turn就提前结束主干判断。"},"trans":[{"source":"请在截止日期前把文件上传到学习平台。","answer":"Please upload the file to the learning platform before the deadline.","keywords":["upload","file","learning platform","before the deadline"],"grammar":"upload something to a platform；祈使句使用动词原形。","acceptedAnswers":["Please upload the file to the learning platform before the deadline.","Please upload the file onto the learning platform before the deadline."],"level":"基础衔接表达","topic":"在线提交","chunks":["upload the file","to the learning platform","before the deadline"],"alternative":"Please upload the file onto the learning platform before the deadline."},{"source":"我关掉消息通知，以便专心阅读。","answer":"I turn off message notifications so that I can focus on reading.","keywords":["turn off","notifications","so that","focus on reading"],"grammar":"so that引导目的从句；focus on后接名词或动名词。","acceptedAnswers":["I turn off message notifications so that I can focus on reading.","I turn off notifications in order to focus on reading."],"level":"基础衔接表达","topic":"目的与专注","chunks":["turn off notifications","so that","focus on reading"],"alternative":"I turn off notifications in order to focus on reading."}]},"2026-09-16":{"title":"志愿活动与团队协作","grammarTip":"表达职责时可用be responsible for，表达参与用participate in。注意过去经历用一般过去时，安排好的将来可用be going to。","words":[{"word":"volunteer","phonetic":"/ˌvɑːlənˈtɪr/","meaning":"志愿者；自愿做","phrase":"work as a volunteer","example":"She works as a volunteer at the community center.","exampleZh":"她在社区中心做志愿者。"},{"word":"community","phonetic":"/kəˈmjuːnəti/","meaning":"社区；群体","phrase":"local community","example":"The event brings the local community together.","exampleZh":"这项活动让当地社区聚在一起。"},{"word":"event","phonetic":"/ɪˈvent/","meaning":"活动；事件","phrase":"organize an event","example":"Our club will organize a reading event.","exampleZh":"我们的社团将组织一场阅读活动。"},{"word":"participate","phonetic":"/pɑːrˈtɪsəpeɪt/","meaning":"参加；参与","phrase":"participate in","example":"More than thirty students participated in the project.","exampleZh":"三十多名学生参加了这个项目。"},{"word":"responsibility","phonetic":"/rɪˌspɑːnsəˈbɪləti/","meaning":"责任；职责","phrase":"take responsibility for","example":"Each member has responsibility for one task.","exampleZh":"每位成员负责一项任务。"},{"word":"prepare","phonetic":"/prɪˈper/","meaning":"准备","phrase":"prepare for","example":"We prepared the room before the children arrived.","exampleZh":"孩子们到达前，我们布置好了房间。"},{"word":"cooperate","phonetic":"/koʊˈɑːpəreɪt/","meaning":"合作","phrase":"cooperate with","example":"The two groups cooperated with each other.","exampleZh":"两个小组相互合作。"},{"word":"experience","phonetic":"/ɪkˈspɪriəns/","meaning":"经历；经验","phrase":"gain experience","example":"Volunteering gave him useful experience.","exampleZh":"志愿服务给了他有用的经验。"}],"grammar":[{"prompt":"Twenty students will participate ___ the community event.","promptZh":"二十名学生将参加社区活动。","options":["at","in","on","with"],"optionsZh":["在","参加","在……上","和"],"answer":1,"explanation":"participate in是固定搭配。","tag":"preposition"},{"prompt":"Lena is responsible ___ preparing the signs.","promptZh":"莉娜负责准备标牌。","options":["to","of","for","by"],"optionsZh":["向","属于","负责","通过"],"answer":2,"explanation":"be responsible for doing something。","tag":"preposition"},{"prompt":"We ___ the room before the guests arrived yesterday.","promptZh":"昨天客人到达前，我们布置了房间。","options":["prepare","prepared","are preparing","prepares"],"optionsZh":["原形","过去式","现在进行时","第三人称单数"],"answer":1,"explanation":"yesterday和arrived提示一般过去时prepared。","tag":"past"},{"prompt":"Our club ___ going to hold a book-sharing event.","promptZh":"我们社团将举办图书分享活动。","options":["am","is","are","be"],"optionsZh":["与I搭配","单数be动词","复数be动词","原形"],"answer":1,"explanation":"主语Our club视为单数，be going to中用is。","tag":"be-verb"},{"prompt":"Members cooperated well, ___ the work finished early.","promptZh":"成员合作得很好，所以工作提前完成。","options":["so","but","although","because of"],"optionsZh":["所以","但是","尽管","因为（后接名词）"],"answer":0,"explanation":"前面是原因，后面是结果，用so。","tag":"connector"},{"prompt":"Which is the main verb in “Students who volunteer regularly gain practical experience” ?","promptZh":"在“经常做志愿服务的学生获得实践经验”中，主句谓语是什么？","options":["volunteer","regularly","gain","experience"],"optionsZh":["做志愿服务（从句谓语）","经常地","获得（主句谓语）","经验"],"answer":2,"explanation":"who volunteer regularly修饰Students；主句谓语gain。","tag":"main-verb"}],"reading":{"title":"A Reading Day for Children","titleZh":"儿童阅读日","level":"基础衔接 · 原创模拟","topic":"志愿服务与团队合作","passage":"The university reading club planned a Saturday event for children in a nearby community. At the first meeting, everyone suggested activities, but nobody recorded who would do each job. Two days later, the club leader noticed that three students were preparing the same game while no one had contacted the community center. The group met again and made a simple responsibility chart. Jia called the center, Omar selected short stories, and two other members prepared pictures and name cards. On Saturday morning, one volunteer was ill, so Omar welcomed families as well as leading a story group. Because the jobs were clear, other members could adjust without confusion. After the event, parents said their children had enjoyed talking about the stories. The volunteers also wrote down what should change next time. They learned that cooperation is not only sharing ideas; it also means accepting a clear responsibility and communicating when a plan changes.","passageZh":"大学阅读社计划周六为附近社区的孩子举办活动。第一次会议上，大家都提建议，却没人记录谁负责哪项工作。两天后，社长发现三名学生在准备同一个游戏，却没人联系社区中心。小组再次开会，制作了简单的职责表：佳联系中心，奥马尔挑短故事，另两人准备图片和姓名卡。周六早晨一名志愿者生病，奥马尔既迎接家庭，又带领故事小组。由于职责清楚，其他成员能不混乱地调整。活动后，家长说孩子们喜欢讨论故事，志愿者也记下下次改进之处。他们明白，合作不只是分享想法，还要承担明确职责，并在计划变化时沟通。","questions":[{"prompt":"What problem appeared after the first meeting?","promptZh":"第一次会议后出现了什么问题？","options":["No children were invited","Several students prepared the same job","The center cancelled the event","The club had no stories"],"optionsZh":["没邀请孩子","几名学生准备了同一项工作","中心取消活动","社团没有故事"],"answer":1,"explanation":"三名学生准备同一个游戏，而另一个重要任务无人负责。","tag":"reading"},{"prompt":"How did the group solve the problem?","promptZh":"小组怎样解决问题？","options":["They made a responsibility chart","They ended the project","They hired workers","They removed all games"],"optionsZh":["制作职责表","终止项目","雇人","取消所有游戏"],"answer":0,"explanation":"第二次会议明确分配职责。","tag":"reading"},{"prompt":"Why could the team adjust when one volunteer was ill?","promptZh":"一名志愿者生病时，团队为何能调整？","options":["The event was delayed","The children went home","The jobs were clearly organized","Parents led every activity"],"optionsZh":["活动延期","孩子回家","工作安排清楚","家长主持所有活动"],"answer":2,"explanation":"原文Because the jobs were clear给出原因。","tag":"reading"},{"prompt":"What broader lesson did the volunteers learn?","promptZh":"志愿者学到了什么更广泛的道理？","options":["Ideas matter more than action","Cooperation needs responsibility and communication","Every plan should remain unchanged","One person should do all jobs"],"optionsZh":["想法比行动重要","合作需要责任与沟通","所有计划都不能变","一人应做所有工作"],"answer":1,"explanation":"末句概括合作的两个必要部分。","tag":"reading"}]},"listening":{"title":"Jobs for Saturday's Event","titleZh":"周六活动的工作安排","level":"基础衔接短听力 · 合成朗读","tip":"边听边建立“人物—任务—时间”对应，注意instead表示替换。","passage":"Before Saturday's community event, please check your responsibility. Mei and Arun will prepare the tables at nine. Rosa will welcome families at the entrance, while I will lead the first reading group. Sam cannot come in the morning, so he will clean the room after the event instead. If your plan changes, tell the group before Friday evening.","passageZh":"周六社区活动前，请确认各自职责。梅和阿伦九点布置桌子；罗莎在入口迎接家庭，我带领第一阅读小组。萨姆上午不能来，所以改为活动后打扫房间。如果计划变化，请在周五晚前通知小组。","dictation":["Please check your responsibility before Saturday's event.","If your plan changes, tell the group before Friday evening."],"dictationZh":["请在周六活动前确认你的职责。","如果计划改变，请在周五晚前通知小组。"],"questions":[{"prompt":"What will Rosa do?","promptZh":"罗莎将做什么？","options":["Prepare tables","Welcome families","Lead the first group","Clean the room"],"optionsZh":["布置桌子","迎接家庭","带第一组","打扫房间"],"answer":1,"explanation":"人物Rosa与welcome families对应。","tag":"listeningChoice"},{"prompt":"When will Sam help?","promptZh":"萨姆什么时候帮忙？","options":["Friday morning","At nine","After the event","Before the families arrive"],"optionsZh":["周五上午","九点","活动后","家庭到达前"],"answer":2,"explanation":"he will clean the room after the event instead。","tag":"listeningChoice"}]},"sent":{"text":"Volunteers who understand their responsibilities can cooperate more effectively.","main":"Volunteers can cooperate more effectively.","translation":"了解自己职责的志愿者能够更有效地合作。","core":["volunteers","can","cooperate","effectively"],"keywords":["志愿者","了解","职责","合作"],"structure":"who understand their responsibilities修饰Volunteers；主句谓语can cooperate。","mainZh":"志愿者能够更有效地合作。","level":"基础衔接句法","topic":"定语从句与团队协作","grammar":["understand是从句谓语。","can后接cooperate原形，effectively修饰动词。"],"examTip":"先保留Volunteers can cooperate，再加入限定信息。"},"trans":[{"source":"每位成员都应该为一项任务负责。","answer":"Each member should be responsible for one task.","keywords":["each member","should be","responsible for","one task"],"grammar":"each加单数名词；should后接be原形。","acceptedAnswers":["Each member should be responsible for one task.","Every member should take responsibility for one task."],"level":"基础衔接表达","topic":"职责分配","chunks":["each member","be responsible for","one task"],"alternative":"Every member should take responsibility for one task."},{"source":"三十多名学生参加了这次社区活动。","answer":"More than thirty students participated in the community event.","keywords":["more than thirty","students","participated in","community event"],"grammar":"已发生的活动用participated；participate in固定搭配。","acceptedAnswers":["More than thirty students participated in the community event.","Over thirty students took part in the community event."],"level":"基础衔接表达","topic":"志愿经历","chunks":["more than thirty students","participated in","the community event"],"alternative":"Over thirty students took part in the community event."}]},"2026-09-17":{"title":"第七天复盘：迁移与错因检查","grammarTip":"今天不加新词。用新语境检查there be、时态、情态动词、连接词、定语从句和词形；答错后写清“不会、没看清还是误判结构”。","words":[],"grammar":[{"prompt":"There ___ several reliable sources in the library database.","promptZh":"图书馆数据库里有几个可靠来源。","options":["is","are","has","was"],"optionsZh":["单数","复数","拥有","过去时单数"],"answer":1,"explanation":"several reliable sources为复数，there be用are。","tag":"be-verb"},{"prompt":"Students must ___ their files before the deadline.","promptZh":"学生必须在截止日期前上传文件。","options":["uploaded","upload","uploads","uploading"],"optionsZh":["过去分词","原形","第三人称单数","现在分词"],"answer":1,"explanation":"must后用动词原形upload。","tag":"modal"},{"prompt":"Yesterday our group ___ for the community event.","promptZh":"昨天我们小组为社区活动做了准备。","options":["prepare","prepares","prepared","is preparing"],"optionsZh":["原形","第三人称单数","过去式","现在进行时"],"answer":2,"explanation":"Yesterday提示一般过去时。","tag":"past"},{"prompt":"The article is difficult, ___ its main idea is clear.","promptZh":"文章很难，但主旨很清楚。","options":["because","but","so","if"],"optionsZh":["因为","但是","所以","如果"],"answer":1,"explanation":"前后是转折关系，用but。","tag":"connector"},{"prompt":"A learner who takes useful notes often ___ information longer.","promptZh":"做有效笔记的学习者常能更久地记住信息。","options":["remember","remembers","remembering","remembered"],"optionsZh":["原形","第三人称单数","现在分词","过去式"],"answer":1,"explanation":"主句主语A learner为单数；who从句结束后，主句谓语用remembers。","tag":"main-verb"},{"prompt":"Turning off messages helps me study more ___.","promptZh":"关掉消息帮助我更高效地学习。","options":["efficient","efficiency","efficiently","efficiencies"],"optionsZh":["高效的","效率","高效地","效率（复数）"],"answer":2,"explanation":"修饰动词study要用副词efficiently。","tag":"word-form"}],"reading":{"title":"What the Record Really Shows","titleZh":"记录真正说明什么","level":"基础衔接周复盘 · 原创模拟","topic":"学习记录与策略调整","passage":"After seven days of practice, Rui opened his study record. At first, he looked only at the total number of correct answers and felt disappointed. Then he examined each section separately. His reading score was fairly strong because he could return to the passage and locate details. In listening, however, he often chose the correct general idea but missed times and room numbers. His vocabulary record showed another pattern: he remembered meanings when he saw words, yet sometimes could not spell those words after hearing them. Rui therefore made a small plan for the next week. He kept the same daily workload, but used four review places for spelling errors and wrote down numbers during his second listening. He did not add an extra hour or replace all his materials. The record helped him change one method at a time. Rui understood that a score is most useful when it points to a specific next action.","passageZh":"练习七天后，瑞打开学习记录。起初他只看总正确数，很失望。随后他分别检查各模块：阅读较好，因为能回原文定位细节；听力常能选对大意，却漏掉时间和房间号；词汇方面，看见单词记得意思，听到后却有时拼不出来。因此，他为下周做了一个小调整：保持每日总量，用四个复习位处理拼写错词，第二遍听时记录数字。他没有额外加一小时，也没有更换所有材料，而是一次改变一种方法。他明白，分数指出明确的下一步行动时才最有用。","questions":[{"prompt":"Why was Rui's reading performance fairly strong?","promptZh":"瑞的阅读表现为什么较好？","options":["He guessed every answer","He could locate details in the passage","He translated every word","He had seen the same article"],"optionsZh":["猜所有答案","能回原文定位细节","逐词翻译","见过同一文章"],"answer":1,"explanation":"原文because后直接说明原因。","tag":"reading"},{"prompt":"What listening details did Rui often miss?","promptZh":"瑞常漏掉哪些听力细节？","options":["Writers and titles","Colors and prices","Times and room numbers","Names of countries"],"optionsZh":["作者和标题","颜色和价格","时间和房间号","国家名称"],"answer":2,"explanation":"明确列出times and room numbers。","tag":"reading"},{"prompt":"How did Rui adjust vocabulary review?","promptZh":"瑞怎样调整词汇复习？","options":["He stopped learning meanings","He used four places for spelling errors","He added fifty new words","He copied every word twenty times"],"optionsZh":["停止学词义","用四个位置复习拼写错词","加五十个新词","每词抄二十遍"],"answer":1,"explanation":"他保持总量，只调整四个复习位。","tag":"reading"},{"prompt":"What principle does the passage emphasize?","promptZh":"文章强调什么原则？","options":["Change every method at once","Use scores to choose a specific action","Study time must always increase","A total score explains every weakness"],"optionsZh":["一次改变所有方法","用分数选择具体行动","学习时间必须一直增加","总分能解释所有弱点"],"answer":1,"explanation":"最后两句强调依据记录做小而具体的调整。","tag":"reading"}]},"listening":{"title":"A Short Weekly Review","titleZh":"简短周复盘","level":"基础衔接周复盘短听力 · 合成朗读","tip":"不看原文完成两题；第二遍专门记录数字、问题和下一步行动。","passage":"This week I completed five full study days. Reading was my strongest part, but I missed three listening questions about time. I also spelled four familiar words incorrectly. Next week I will keep the same number of daily tasks. During the second listening, I will write down numbers, and my first four review words will come from this week's spelling errors.","passageZh":"本周我完成了五个完整学习日。阅读是最强项，但我错了三道关于时间的听力题；四个熟悉单词也拼错了。下周保持相同每日任务量。第二遍听时记录数字，前四个复习词来自本周拼写错误。","dictation":["Reading was my strongest part this week.","I will keep the same number of daily tasks."],"dictationZh":["阅读是我本周最强的部分。","我会保持相同数量的每日任务。"],"questions":[{"prompt":"How many full study days were completed?","promptZh":"完成了几个完整学习日？","options":["Three","Four","Five","Seven"],"optionsZh":["三个","四个","五个","七个"],"answer":2,"explanation":"开头说completed five full study days。","tag":"listeningChoice"},{"prompt":"What will the learner write down during the second listening?","promptZh":"学习者第二遍听时会记录什么？","options":["Numbers","Every sentence","New article titles","All Chinese meanings"],"optionsZh":["数字","每个句子","新文章标题","全部中文义"],"answer":0,"explanation":"计划是write down numbers。","tag":"listeningChoice"}]},"sent":{"text":"A record that identifies a specific problem makes the next practice more useful.","main":"A record makes the next practice more useful.","translation":"指出具体问题的记录会让下一次练习更有效。","core":["record","makes","practice","useful"],"keywords":["记录","具体问题","下次练习","有效"],"structure":"that identifies a specific problem修饰record；主句谓语makes，more useful是宾补。","mainZh":"记录让下一次练习更有效。","level":"基础衔接周测句法","topic":"定语从句与make结构","grammar":["identifies属于定语从句。","make something + adjective表示使某物怎样。"],"examTip":"先写A record makes practice useful，再处理限定和比较级。"},"trans":[{"source":"这份记录帮助我发现一个具体问题。","answer":"This record helps me identify a specific problem.","keywords":["record","helps me","identify","specific problem"],"grammar":"help somebody do something；specific修饰problem。","acceptedAnswers":["This record helps me identify a specific problem.","The record helps me find a specific problem."],"level":"基础衔接周测表达","topic":"错因复盘","chunks":["this record","helps me identify","a specific problem"],"alternative":"The record helps me find a specific problem."},{"source":"下周我会保持相同的每日任务量。","answer":"Next week I will keep the same number of daily tasks.","keywords":["next week","will keep","same number","daily tasks"],"grammar":"next week配will；the same number of后接可数名词复数。","acceptedAnswers":["Next week I will keep the same number of daily tasks.","I will keep the same daily workload next week."],"level":"基础衔接周测表达","topic":"计划调整","chunks":["next week","keep the same number of","daily tasks"],"alternative":"I will keep the same daily workload next week."}]},"2026-09-18":{"title":"理性消费与环保选择","grammarTip":"比较商品时使用比较级；avoid后接动名词；讨论一般事实用一般现在时。区分product、price与value。","words":[{"word":"product","phonetic":"/ˈprɑːdʌkt/","meaning":"产品","phrase":"choose a product","example":"This product uses less plastic.","exampleZh":"这款产品使用更少的塑料。"},{"word":"compare","phonetic":"/kəmˈper/","meaning":"比较","phrase":"compare A with B","example":"Compare the two bags before you decide.","exampleZh":"决定前比较一下这两个包。"},{"word":"waste","phonetic":"/weɪst/","meaning":"浪费；废物","phrase":"reduce waste","example":"Reusable bottles can reduce plastic waste.","exampleZh":"可重复使用的瓶子能减少塑料废物。"},{"word":"recycle","phonetic":"/ˌriːˈsaɪkəl/","meaning":"回收利用","phrase":"recycle paper","example":"Our dormitory recycles paper and glass.","exampleZh":"我们的宿舍回收纸张和玻璃。"},{"word":"environment","phonetic":"/ɪnˈvaɪrənmənt/","meaning":"环境","phrase":"protect the environment","example":"Small choices can help protect the environment.","exampleZh":"小选择也能帮助保护环境。"},{"word":"durable","phonetic":"/ˈdʊrəbəl/","meaning":"耐用的","phrase":"a durable bag","example":"A durable bag may cost more but last longer.","exampleZh":"耐用的包可能更贵，但用得更久。"},{"word":"avoid","phonetic":"/əˈvɔɪd/","meaning":"避免","phrase":"avoid doing","example":"I avoid buying things that I do not need.","exampleZh":"我避免购买不需要的东西。"},{"word":"choice","phonetic":"/tʃɔɪs/","meaning":"选择","phrase":"make a choice","example":"Price is only one part of a good choice.","exampleZh":"价格只是好选择的一部分。"}],"grammar":[{"prompt":"This metal bottle is ___ than the plastic one.","promptZh":"这个金属瓶比塑料瓶更耐用。","options":["durable","more durable","most durable","durably"],"optionsZh":["耐用的","更耐用的","最耐用的","耐用地"],"answer":1,"explanation":"than提示比较级，多音节形容词用more durable。","tag":"comparison"},{"prompt":"Liu avoids ___ products that he does not need.","promptZh":"刘避免购买不需要的产品。","options":["buy","to buy","buying","bought"],"optionsZh":["原形","不定式","动名词","过去式"],"answer":2,"explanation":"avoid后接动名词buying。","tag":"verb-form"},{"prompt":"Reusable cups ___ the amount of daily waste.","promptZh":"可重复使用的杯子减少日常垃圾量。","options":["reduces","reduce","reduced","is reducing"],"optionsZh":["第三人称单数","一般现在时复数","过去式","现在进行时"],"answer":1,"explanation":"主语Reusable cups是复数，一般事实用reduce。","tag":"present"},{"prompt":"We compared this product ___ three cheaper ones.","promptZh":"我们把这款产品与三款更便宜的产品作比较。","options":["with","from","into","during"],"optionsZh":["与……比较","从","进入","在……期间"],"answer":0,"explanation":"compare A with B。","tag":"preposition"},{"prompt":"The bag costs more, ___ it can be used for many years.","promptZh":"这个包价格更高，但可以使用很多年。","options":["but","because","so that","unless"],"optionsZh":["但是","因为","以便","除非"],"answer":0,"explanation":"价格高与耐用形成转折，用but。","tag":"connector"},{"prompt":"Which is the main verb in “Products that last longer often create less waste” ?","promptZh":"在“使用更久的产品通常产生更少废物”中，主句谓语是什么？","options":["last","longer","create","waste"],"optionsZh":["持续（从句谓语）","更久","产生（主句谓语）","废物"],"answer":2,"explanation":"that last longer修饰Products；主句谓语create。","tag":"main-verb"}],"reading":{"title":"Looking Beyond the Lowest Price","titleZh":"不只看最低价格","level":"基础衔接 · 原创模拟","topic":"消费、环境与判断","passage":"Nadia needed a new water bottle for university. In a shop, she found a cheap plastic bottle and a metal bottle that cost almost three times as much. At first, the plastic one seemed like the obvious choice. Then Nadia compared more than the price. The metal bottle could be repaired with a new lid, while the plastic one would probably be thrown away if it broke. She also read instructions about cleaning and checked whether both products were safe for hot drinks. Nadia chose the metal bottle because she expected to use it for several years. Her decision does not mean that the most expensive product is always best. A high price can reflect advertising rather than quality. Nadia's method was to consider how often she would use an item, how long it might last, and what would happen at the end of its life. By asking these questions, shoppers can reduce waste without buying unnecessary “green” products.","passageZh":"娜迪娅上大学需要新水瓶。商店里有便宜塑料瓶，也有价格近三倍的金属瓶。起初塑料瓶似乎显然更合适，随后她比较了价格之外的因素：金属瓶的盖子坏了可以更换，塑料瓶坏了可能直接被扔掉。她还查看清洁说明，确认两者是否都能安全装热饮。她选择金属瓶，因为预计使用多年。这不意味着最贵的产品总是最好，高价可能来自广告而非质量。她的方法是考虑使用频率、耐用时间以及物品寿命结束后的处理。提出这些问题，消费者就能在不购买多余“绿色”产品的情况下减少浪费。","questions":[{"prompt":"Why did the plastic bottle first seem attractive?","promptZh":"塑料瓶起初为什么有吸引力？","options":["It was cheaper","It was easier to repair","It lasted many years","It was made of metal"],"optionsZh":["更便宜","更易维修","能用多年","由金属制成"],"answer":0,"explanation":"第一印象来自较低价格。","tag":"reading"},{"prompt":"What repair advantage did the metal bottle have?","promptZh":"金属瓶有什么维修优势？","options":["Its body was free","Its lid could be replaced","It needed no cleaning","It became plastic"],"optionsZh":["瓶身免费","瓶盖可更换","不用清洁","会变成塑料"],"answer":1,"explanation":"原文说可通过new lid修理。","tag":"reading"},{"prompt":"What warning does the writer give about price?","promptZh":"作者对价格提出什么提醒？","options":["The cheapest is always safest","High prices may come from advertising","Expensive goods never last","Price has no role in a choice"],"optionsZh":["最便宜总最安全","高价可能来自广告","贵商品从不耐用","价格完全没作用"],"answer":1,"explanation":"文章明确区分高价和真实质量。","tag":"reading"},{"prompt":"Which question is part of Nadia's method?","promptZh":"哪个问题属于娜迪娅的方法？","options":["Will my friends see the brand?","How long might the item last?","Is the package the brightest?","Can I buy several at once?"],"optionsZh":["朋友会看到品牌吗","物品可能用多久","包装最亮吗","能一次买几个吗"],"answer":1,"explanation":"结尾列出使用频率、寿命和最终处理。","tag":"reading"}]},"listening":{"title":"Choosing Cups for a Student Café","titleZh":"为学生咖啡馆选择杯子","level":"基础衔接短听力 · 合成朗读","tip":"听清两种方案的价格、使用次数和最终决定，注意cheaper与cost less over time的区别。","passage":"We need cups for the student café. Paper cups are cheaper to buy today, but we would need hundreds every week. These washable cups cost more at first and can be used many times. The café has a dishwasher, so cleaning them is possible. Let us order fifty washable cups and keep a small number of paper ones for busy events.","passageZh":"学生咖啡馆需要杯子。纸杯今天购买更便宜，但每周要用数百个。可清洗杯子起初更贵，却能多次使用。咖啡馆有洗碗机，清洗可行。我们订五十个可清洗杯，并为繁忙活动保留少量纸杯。","dictation":["These washable cups can be used many times.","Let us order fifty washable cups."],"dictationZh":["这些可清洗杯能使用很多次。","我们订购五十个可清洗杯吧。"],"questions":[{"prompt":"Why are washable cups practical for the café?","promptZh":"可清洗杯为什么适合咖啡馆？","options":["They are made of paper","The café has a dishwasher","They are used only once","No one drinks there"],"optionsZh":["由纸制成","咖啡馆有洗碗机","只用一次","没人喝东西"],"answer":1,"explanation":"有洗碗机使重复清洁成为可能。","tag":"listeningChoice"},{"prompt":"What will the café order?","promptZh":"咖啡馆将订购什么？","options":["Only paper cups","Fifty washable cups plus some paper cups","Five metal bottles","Hundreds of glass plates"],"optionsZh":["只有纸杯","五十个可清洗杯和少量纸杯","五个金属瓶","数百个玻璃盘"],"answer":1,"explanation":"最后一句给出组合方案。","tag":"listeningChoice"}]},"sent":{"text":"Products that can be used for many years may create less waste.","main":"Products may create less waste.","translation":"可以使用多年的产品可能产生更少的废物。","core":["products","may","create","waste"],"keywords":["产品","使用多年","可能","更少废物"],"structure":"that can be used for many years修饰Products，其中含被动语态；主句谓语may create。","mainZh":"产品可能产生更少的废物。","level":"基础衔接句法","topic":"定语从句与被动语态","grammar":["can be used是从句中的被动结构。","主句情态动词may后用create原形。"],"examTip":"先跳过that从句，得到Products may create less waste。"},"trans":[{"source":"决定前，我们应该比较这两种产品。","answer":"We should compare the two products before making a decision.","keywords":["should compare","two products","before","decision"],"grammar":"should后用compare原形；介词before后可接动名词。","acceptedAnswers":["We should compare the two products before making a decision.","Before we decide, we should compare the two products."],"level":"基础衔接表达","topic":"理性选择","chunks":["should compare","the two products","before making a decision"],"alternative":"Before we decide, we should compare the two products."},{"source":"耐用的物品可以帮助减少浪费。","answer":"Durable items can help reduce waste.","keywords":["durable","items","can help","reduce waste"],"grammar":"durable作定语；help后接reduce原形。","acceptedAnswers":["Durable items can help reduce waste.","Durable products can help us reduce waste."],"level":"基础衔接表达","topic":"环境影响","chunks":["durable items","can help reduce","waste"],"alternative":"Durable products can help us reduce waste."}]},"2026-09-19":{"title":"兼职申请与职场沟通","grammarTip":"apply for表示申请职位，be good at后接名词或动名词。描述经历时区分一般过去时和现在完成时的用途。","words":[{"word":"apply","phonetic":"/əˈplaɪ/","meaning":"申请；应用","phrase":"apply for a job","example":"I plan to apply for a weekend job.","exampleZh":"我打算申请一份周末工作。"},{"word":"position","phonetic":"/pəˈzɪʃən/","meaning":"职位；位置","phrase":"part-time position","example":"The library has a part-time position available.","exampleZh":"图书馆有一个兼职职位。"},{"word":"interview","phonetic":"/ˈɪntərvjuː/","meaning":"面试；采访","phrase":"job interview","example":"Her job interview begins at ten.","exampleZh":"她的求职面试十点开始。"},{"word":"skill","phonetic":"/skɪl/","meaning":"技能","phrase":"communication skills","example":"The position requires good communication skills.","exampleZh":"这个职位需要良好的沟通技能。"},{"word":"employer","phonetic":"/ɪmˈplɔɪər/","meaning":"雇主","phrase":"a future employer","example":"The employer asked about my class schedule.","exampleZh":"雇主询问了我的课程安排。"},{"word":"communicate","phonetic":"/kəˈmjuːnɪkeɪt/","meaning":"沟通；传达","phrase":"communicate clearly","example":"Staff members must communicate clearly with customers.","exampleZh":"员工必须与顾客清楚沟通。"},{"word":"customer","phonetic":"/ˈkʌstəmər/","meaning":"顾客","phrase":"help a customer","example":"He listened carefully to the customer's question.","exampleZh":"他仔细听了顾客的问题。"},{"word":"salary","phonetic":"/ˈsæləri/","meaning":"薪水","phrase":"monthly salary","example":"The advertisement explains the hours and salary.","exampleZh":"招聘广告说明了工作时间和薪水。"}],"grammar":[{"prompt":"Tara applied ___ a part-time position at the library.","promptZh":"塔拉申请了图书馆的兼职职位。","options":["for","from","with","at"],"optionsZh":["申请","从","和","在"],"answer":0,"explanation":"apply for a position是固定搭配。","tag":"preposition"},{"prompt":"The job requires good communication ___.","promptZh":"这份工作需要良好的沟通技能。","options":["skill","skills","skilled","skillfully"],"optionsZh":["单数技能","技能（复数）","熟练的","熟练地"],"answer":1,"explanation":"communication skills通常用复数，作requires的宾语。","tag":"word-form"},{"prompt":"I am good at ___ with different people.","promptZh":"我擅长与不同的人沟通。","options":["communicate","to communicate","communicating","communicated"],"optionsZh":["原形","不定式","动名词","过去式"],"answer":2,"explanation":"介词at后接动名词communicating。","tag":"verb-form"},{"prompt":"Last summer, Ben ___ in a busy café.","promptZh":"去年夏天，本在一家繁忙的咖啡馆工作。","options":["works","worked","has worked","working"],"optionsZh":["一般现在时","一般过去时","现在完成时","现在分词"],"answer":1,"explanation":"明确的过去时间Last summer搭配一般过去时worked。","tag":"past"},{"prompt":"The employer asked ___ I was available on Saturdays.","promptZh":"雇主问我周六是否有空。","options":["whether","because","although","until"],"optionsZh":["是否","因为","虽然","直到"],"answer":0,"explanation":"间接一般疑问句用whether或if。","tag":"noun-clause"},{"prompt":"Which is the main verb in “Applicants who speak clearly often make a strong first impression” ?","promptZh":"在“说话清楚的申请者常留下良好第一印象”中，主句谓语是什么？","options":["speak","clearly","make","impression"],"optionsZh":["说（从句谓语）","清楚地","留下（主句谓语）","印象"],"answer":2,"explanation":"who speak clearly修饰Applicants；主句谓语make。","tag":"main-verb"}],"reading":{"title":"Preparing for a Campus Job Interview","titleZh":"准备校园兼职面试","level":"基础衔接 · 原创模拟","topic":"求职与沟通","passage":"Sofia saw an advertisement for a part-time assistant at the campus sports center. The hours fitted her class schedule, but she had never had a formal job interview. She first read the advertisement again and underlined three requirements: answering visitors' questions, keeping simple records, and working on Saturday mornings. Instead of memorizing a long speech, Sofia prepared short examples. To show communication skills, she described how she had explained club rules to new members. To show responsibility, she talked about arriving early for a volunteer event. She also wrote two questions for the employer about training and weekly hours. During the interview, Sofia did not understand one question immediately. She politely asked the interviewer to repeat it, then answered clearly. This moment did not make her look weak; it showed that she could solve a communication problem calmly. Sofia received the position, but the most useful result was learning to connect each job requirement with real evidence from her own experience.","passageZh":"索菲娅看到校园体育中心招聘兼职助理，工作时间适合课程安排，但她从未参加正式求职面试。她重读广告，划出三项要求：回答访客问题、保存简单记录、周六上午上班。她没有背长篇发言，而是准备简短事例：用向新成员解释社团规则展示沟通能力，用提前到志愿活动展示责任感；还写下关于培训和每周工时的两个问题。面试时，她没有立刻听懂一个问题，便礼貌请面试官重复，再清楚作答。这没有显得软弱，反而表明她能冷静解决沟通问题。她获得职位，但最有价值的是学会把每项工作要求与自身经历的真实证据联系起来。","questions":[{"prompt":"Which requirement was included in the advertisement?","promptZh":"招聘广告包含哪项要求？","options":["Working every night","Answering visitors' questions","Teaching a full course","Driving to another city"],"optionsZh":["每晚工作","回答访客问题","教授完整课程","开车去外地"],"answer":1,"explanation":"三项要求中的第一项是回答访客问题。","tag":"reading"},{"prompt":"How did Sofia prepare for the interview?","promptZh":"索菲娅怎样准备面试？","options":["She memorized one long speech","She prepared examples linked to requirements","She asked a friend to attend for her","She ignored the advertisement"],"optionsZh":["背一篇长发言","准备与要求对应的事例","让朋友代替参加","忽略广告"],"answer":1,"explanation":"她为沟通和责任等要求各准备了真实事例。","tag":"reading"},{"prompt":"What did Sofia do when she missed a question?","promptZh":"索菲娅没听懂问题时做了什么？","options":["She guessed silently","She ended the interview","She asked for repetition","She changed the subject"],"optionsZh":["默默猜测","结束面试","请求重复","改变话题"],"answer":2,"explanation":"她礼貌请面试官重复。","tag":"reading"},{"prompt":"What was the most useful lesson for Sofia?","promptZh":"对索菲娅最有用的收获是什么？","options":["Salary is the only concern","Every answer should be memorized","Requirements should be supported by real examples","Experience matters only after graduation"],"optionsZh":["薪水是唯一重点","每个答案都应背诵","用真实事例支持职位要求","经历只在毕业后重要"],"answer":2,"explanation":"末句直接总结了她的方法。","tag":"reading"}]},"listening":{"title":"A Call About a Part-Time Position","titleZh":"关于兼职职位的电话","level":"基础衔接短听力 · 合成朗读","tip":"听清面试日期、需携带物品和工作时段；不要把可选信息当硬性要求。","passage":"Hello, this is the student services office calling about your application. We would like to interview you on Tuesday at three fifteen in
